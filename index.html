<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>嵌入页面</title>
    <style>
        /* 重置页面边距，让 iframe 铺满全屏 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;  /* 去掉边框 */
        }
    </style>
</head>
<body>
    <!-- 通过 iframe 嵌入 ./test/test.html -->
    <iframe src="./test/test.html"></iframe>
</body>
</html>
