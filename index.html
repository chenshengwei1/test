<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>项目导航</title>
    <!-- 引入jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- 引入字体图标 -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* ----- 全局重置 ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            font-family: 'Arial', sans-serif;
        }

        body {
            background: #0f0f0f;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ----- 主页容器 (默认显示) ----- */
        #homePage {
            display: block;
            width: 100%;
            min-height: 100vh;
            position: relative;
            z-index: 1;
        }

        /* ----- 全屏 iframe 容器 (默认隐藏) ----- */
        #fullscreenFrame {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1000;
            background: #0f0f0f;
        }

        #fullscreenFrame iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* ----- 404 错误遮罩 (默认隐藏) ----- */
        #errorOverlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 15, 15, 0.95);
            z-index: 1001;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            text-align: center;
            padding: 2rem;
        }

        #errorOverlay .error-icon {
            font-size: 80px;
            color: #ff4757;
            margin-bottom: 20px;
        }

        #errorOverlay .error-title {
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 10px;
            color: #ff4757;
        }

        #errorOverlay .error-desc {
            font-size: 18px;
            color: rgba(255,255,255,0.7);
            margin-bottom: 8px;
        }

        #errorOverlay .error-path {
            font-size: 14px;
            color: rgba(255,255,255,0.4);
            background: rgba(255,255,255,0.05);
            padding: 8px 20px;
            border-radius: 8px;
            margin-top: 10px;
            font-family: monospace;
        }

        /* ----- 悬浮返回按钮 (默认隐藏，进入子页面后显示) 可拖拽 ----- */
        #backHomeBtn {
            display: none;
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 2000;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 50px;
            padding: 14px 28px;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: grab; /* 拖动提示 */
            transition: box-shadow 0.3s ease, background 0.3s ease;
            box-shadow: 0 8px 30px rgba(0,0,0,0.4);
            align-items: center;
            gap: 10px;
            user-select: none;
            touch-action: none; /* 避免触屏滚动干扰 */
        }

        #backHomeBtn:active {
            cursor: grabbing;
        }

        #backHomeBtn:hover {
            transform: translateY(-3px) scale(1.03);
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 0 12px 40px rgba(0,0,0,0.6);
        }

        #backHomeBtn i {
            font-size: 18px;
            pointer-events: none; /* 避免图标干扰拖拽 */
        }

        /* ----- 主页原有样式 (保持不变) ----- */
        .background-effect {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: linear-gradient(45deg, #0f0f0f, #1a1a1a);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .header {
            text-align: center;
            margin-bottom: 4rem;
        }

        .title {
            color: #fff;
            font-size: 3.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 15px rgba(255,255,255,0.5);
            animation: glow 2s ease-in-out infinite alternate;
        }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            padding: 1rem;
        }

        .project-card {
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            padding: 2rem;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            transform-style: preserve-3d;
            transition: all 0.5s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .project-card:hover {
            transform: translateY(-10px) rotateX(5deg) rotateY(5deg);
            box-shadow: 0 15px 30px rgba(0,0,0,0.3);
            background: rgba(255,255,255,0.1);
        }

        .project-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255,255,255,0.2),
                transparent
            );
            transition: 0.5s;
        }

        .project-card:hover::before {
            left: 100%;
        }

        .project-title {
            color: #fff;
            font-size: 1.5rem;
            margin-bottom: 1rem;
            position: relative;
        }

        .project-description {
            color: rgba(255,255,255,0.7);
            line-height: 1.6;
        }

        @keyframes glow {
            from {
                text-shadow: 0 0 10px #fff,
                           0 0 20px #fff,
                           0 0 30px #e60073,
                           0 0 40px #e60073,
                           0 0 50px #e60073,
                           0 0 60px #e60073,
                           0 0 70px #e60073;
            }
            to {
                text-shadow: 0 0 20px #fff,
                           0 0 30px #ff4da6,
                           0 0 40px #ff4da6,
                           0 0 50px #ff4da6,
                           0 0 60px #ff4da6,
                           0 0 70px #ff4da6,
                           0 0 80px #ff4da6;
            }
        }

        @media (max-width: 768px) {
            .projects-grid {
                grid-template-columns: 1fr;
            }
            .title {
                font-size: 2.2rem;
            }
            #backHomeBtn {
                bottom: 20px;
                right: 20px;
                padding: 12px 20px;
                font-size: 14px;
            }
        }

        /* 旧样式残留清理 */
        .mmd-viewer-container,
        .controls-panel,
        #canvas-container,
        #model-viewer {
            display: none !important;
        }

        /* 在 style 中添加 */
        #backHomeBtn.drag-active {
            animation: borderFlash 0.8s ease-in-out 3;
            border-color: #00ff88;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
        }

        @keyframes borderFlash {
            0% { border-color: rgba(255,255,255,0.2); box-shadow: 0 8px 30px rgba(0,0,0,0.4); }
            50% { border-color: #00ff88; box-shadow: 0 0 30px rgba(0, 255, 136, 0.8); }
            100% { border-color: rgba(255,255,255,0.2); box-shadow: 0 8px 30px rgba(0,0,0,0.4); }
        }

        .right-tools{
            width: auto;
            height: auto;
            position: absolute;
            right: 14px;
            bottom: 0;
            line-height: 80px;
        }

        .right-tools .btn{
            width: 72px;
            height: auto;
            float: left;
            text-align: center;
            padding: 0;
            cursor: pointer;
        }

        .right-tools .btn i{
            margin: 0 auto 8px;
            font-family: iconfont;
            font-style: normal;
            display: block;
            font-size: 22px;
            width: 44px;
            height: 44px;
            background-color: rgba(0, 0, 0, .5);
            border-radius: 22px;
            line-height: 44px;
            float: top;
            border: 1px solid #999;
        }

        .right-tools .btn i{
            margin: 0 0 18px;
            float: top;
            line-height: 14px;
            width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            text-shadow: 0 0 3px #000;
        }
    </style>
</head>
<body>

    <!-- ====== 背景特效 ====== -->
    <div class="background-effect"></div>

    <!-- ====== 主页内容 ====== -->
    <div id="homePage">
        <div class="container">
            <header class="header">
                <h1 class="title">项目中心</h1>
            </header>

            <div class="projects-grid" id="projectsContainer">
                <!-- 项目卡片通过 JavaScript 动态生成 -->
            </div>
        </div>
    </div>

    <!-- ====== 全屏 iframe 容器 ====== -->
    <div id="fullscreenFrame">
        <iframe id="pageFrame" src=""></iframe>
        <!-- 404 错误遮罩 -->
        <div id="errorOverlay">
            <div class="error-icon">🔍</div>
            <div class="error-title">404</div>
            <div class="error-desc">页面未找到</div>
            <div class="error-path" id="errorPath">./example/page.html</div>
        </div>
    </div>

    <!-- ====== 悬浮返回主页按钮 ====== -->
    <button id="backHomeBtn">
        <i class="fas fa-arrow-left"></i> 回到主页
    </button>

    <script>
        // ============================================================
        //  1. 项目数据
        // ============================================================
        const projects = [
            { title: "Chat", description: "聊天室", url: "./chat/wechat.html", icon: "fas fa-robot" },
            { title: "Easyfile", description: "实时数据展示系统", url: "./easyfile/easyfile.html", icon: "fas fa-chart-line" },
            { title: "MarkDown", description: "智能设备管理中心", url: "./easyfile/md.html", icon: "fas fa-network-wired" },
            { title: "云存储", description: "安全文件存储解决方案", url: "./cloudstorage/storage.html", icon: "fas fa-cloud" },
            { title: "漫剧资产", description: "安全文件存储解决方案", url: "./asset/assetindex.html", icon: "fas fa-cloud" },
            { title: "Test", description: "安全文件存储解决方案", url: "./test/test.html", icon: "fas fa-cloud" },
            { title: "水电线路", description: "VR 3D", url: "./asset/vr-3d.html", icon: "fas fa-cloud" },
            { title: "全屋定制", description: "VR 3D", url: "./asset/3jv-render.3vjia.html", icon: "fas fa-cloud" }
        ];

        // ============================================================
        //  2. DOM 引用
        // ============================================================
        const $homePage = $('#homePage');
        const $fullscreenFrame = $('#fullscreenFrame');
        const $pageFrame = $('#pageFrame');
        const $errorOverlay = $('#errorOverlay');
        const $errorPath = $('#errorPath');
        const $backBtn = $('#backHomeBtn');
        const $container = $('#projectsContainer');

        // ============================================================
        //  3. URL 参数工具
        // ============================================================
        function getUrlParam(name) {
            const params = new URLSearchParams(window.location.search);
            return params.get(name);
        }

        function setUrlParam(name, value) {
            const url = new URL(window.location);
            url.searchParams.set(name, value);
            window.history.replaceState({}, '', url);
        }

        // 根据 p 参数查找项目
        function findProjectByParam(param) {
            if (!param) return null;
            return projects.find(p => p.title.toLowerCase() === param.toLowerCase()) || null;
        }

        // ============================================================
        //  4. 核心函数：进入子页面 (同时更新URL)
        // ============================================================
        function openProjectWithCheck(url, title) {
            // 隐藏主页
            $homePage.hide();
            $fullscreenFrame.show();
            $backBtn.css('display', 'flex');

            // 隐藏 404 遮罩
            $errorOverlay.hide();

            // 更新 URL 参数 (p=项目标题)
            if (title) {
                setUrlParam('p', title);
            } else {
                // 从 url 反推 title (若未提供)
                const found = projects.find(p => p.url === url);
                if (found) setUrlParam('p', found.title);
            }

            // 用 fetch 检测文件是否存在
            fetch(url, { method: 'HEAD', mode: 'cors' })
                .then(response => {
                    if (response.ok) {
                        $pageFrame.attr('src', url);
                        $errorOverlay.hide();
                    } else {
                        show404Error(url);
                    }
                })
                .catch(() => {
                    // 跨域或网络问题：直接加载 iframe，并设置超时检测
                    $pageFrame.attr('src', url);
                    let timeoutId = setTimeout(() => {
                        show404Error(url);
                    }, 3000);
                    $pageFrame.off('load.errorCheck').on('load.errorCheck', function() {
                        clearTimeout(timeoutId);
                        $errorOverlay.hide();
                    });
                });
        }

        // 显示 404 错误
        function show404Error(url) {
            $errorPath.text(url);
            $errorOverlay.css('display', 'flex');
            $pageFrame.attr('src', url);
        }

        // ============================================================
        //  5. 核心函数：回到主页 (清除URL参数)
        // ============================================================
        function goHome() {
            $homePage.show();
            $fullscreenFrame.hide();
            $backBtn.hide();
            $pageFrame.attr('src', '');
            // 移除 URL 中的 p 参数
            const url = new URL(window.location);
            url.searchParams.delete('p');
            window.history.replaceState({}, '', url);
        }

        // ============================================================
        //  6. 动态生成项目卡片 + 根据参数自动打开
        // ============================================================
        $(document).ready(function() {
            // 生成卡片
            projects.forEach((project, index) => {
                const card = $('<div>')
                    .addClass('project-card')
                    .html(`
                        <i class="${project.icon} fa-2x" style="color: #fff; margin-bottom: 1rem;"></i>
                        <h3 class="project-title">${project.title}</h3>
                        <p class="project-description">${project.description}</p>
                    `)
                    .click(function() {
                        $(this).css({ transform: 'scale(0.95)', opacity: 0.8 });
                        setTimeout(() => {
                            openProjectWithCheck(project.url, project.title);
                            $(this).css({ transform: '', opacity: '' });
                        }, 300);
                    })
                    .hover(
                        function() { $(this).css('transform', 'translateY(-10px) rotateX(5deg) rotateY(5deg)'); },
                        function() { $(this).css('transform', ''); }
                    );
                setTimeout(() => {
                    card.css({ opacity: 1, transform: 'translateY(0)' });
                }, index * 200);
                $container.append(card);
            });

            // ---- 处理 URL 参数 p，自动打开对应项目 ----
            const paramProject = getUrlParam('p');
            if (paramProject) {
                const matched = findProjectByParam(paramProject);
                if (matched) {
                    // 延迟一下确保 DOM 完全加载，然后自动打开
                    setTimeout(() => {
                        openProjectWithCheck(matched.url, matched.title);
                    }, 400);
                } else {
                    // 如果参数无效，可以忽略
                    console.warn('未找到项目: ' + paramProject);
                }
            }

            // ============================================================
            //  7. 返回主页按钮事件 (点击回到主页)
            // ============================================================
            $backBtn.click(function(e) {
                // 避免点击触发拖拽误操作
                if ($backBtn.data('dragging') || isDragging  || $backBtn.data('justDragged')) return;
                goHome();
            });

            // ============================================================
            //  8. 键盘快捷键：ESC 返回主页
            // ============================================================
            $(document).keydown(function(e) {
                if (e.key === 'Escape' && $fullscreenFrame.is(':visible')) {
                    goHome();
                }
            });

            // ============================================================
            //  9. 鼠标拖拽功能 (按下3秒后激活)
            // ============================================================
            let dragTimer = null;
            let isDragging = false;
            let offsetX = 0, offsetY = 0;
            let startX = 0, startY = 0;
            let mouseDownTime = 0;

            $backBtn.on('mousedown', function(e) {
                // 只响应左键
                if (e.button !== 0) return;
                const now = Date.now();
                mouseDownTime = now;

                // 清除之前的定时器
                if (dragTimer) clearTimeout(dragTimer);

                // 记录初始位置
                const rect = this.getBoundingClientRect();
                startX = rect.left;
                startY = rect.top;

                // 3秒后启用拖动
                dragTimer = setTimeout(() => {
                    // 检查鼠标是否还按着（通过检测鼠标状态，但无法直接获取，用标记）
                    // 如果鼠标已松开，则不启用拖动
                    if (!isDragging && $backBtn.data('mousedown')) {
                        isDragging = true;
                        console.log('isDragging starting');
                        $backBtn.data('dragging', true);
                        $backBtn.css('cursor', 'grabbing');

                        // 添加闪烁效果
                        $backBtn.addClass('drag-active');

                        // 计算偏移
                        offsetX = e.clientX - rect.left;
                        offsetY = e.clientY - rect.top;
                    }
                }, 1500);
                $backBtn.data('mousedown', true);
            });

            $(document).on('mousemove', function(e) {
                if (!isDragging) return;
                // 防止按钮被拖出可视区域（可自由拖动，不加限制）
                let left = e.clientX - offsetX;
                let top = e.clientY - offsetY;
                // 可加边界约束（可选）
                $backBtn.css({
                    left: left + 'px',
                    top: top + 'px',
                    right: 'auto',
                    bottom: 'auto'
                });
            });

            $(document).on('mouseup', function(e) {
                // 清除按下标记
                $backBtn.data('mousedown', false);
                // 移除闪烁效果
                $backBtn.removeClass('drag-active');
                // 清除定时器
                if (dragTimer) {
                    clearTimeout(dragTimer);
                    dragTimer = null;
                }
                // 如果正在拖动，结束拖动状态
                if (isDragging) {
                    console.log('isDragging end');
                    isDragging = false;
                    $backBtn.data('dragging', false);
                    $backBtn.css('cursor', 'grab');

                     // 设置刚刚拖拽标记，250ms内点击不触发返回
                    $backBtn.data('justDragged', true);
                    setTimeout(() => {
                        $backBtn.data('justDragged', false);
                    }, 250);
                }
            });

            // 防止拖拽时选中文本
            $backBtn.on('dragstart', function(e) { e.preventDefault(); });

            // 鼠标悬停提示
            $backBtn.css('cursor', 'grab');

            // 额外：若用户按下后快速移动，但3秒未到，不触发拖动
            // 用mouseleave取消定时器（可选）
            $backBtn.on('mouseleave', function() {
                if (dragTimer) {
                    clearTimeout(dragTimer);
                    dragTimer = null;
                }
                // 如果未进入拖动状态，重置标记
                if (!isDragging) {
                    $backBtn.data('mousedown', false);
                }
            });

            console.log('✅ 项目导航已启动！共 ' + projects.length + ' 个项目');
            console.log('💡 按 ESC 键可快速返回主页');
            console.log('🖱️ 返回按钮按住3秒后可拖拽移动');
        });
    </script>

</body>
</html>
