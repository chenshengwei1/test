<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D全景查看器 · 多场景切换</title>
    <style>
        * { margin: 0; padding: 0; }
        body { overflow: hidden; background: #0a0a0a; font-family: -apple-system, "PingFang SC", Arial, sans-serif; }
        canvas { display: block; }

        /* ===== 顶部栏 ===== */
        .header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 14px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 20;
            box-sizing: border-box;
            background: linear-gradient(180deg, rgba(0,0,0,0.7) 0%, transparent 100%);
            pointer-events: none;
        }
        .header h1 {
            color: #fff;
            font-size: 17px;
            font-weight: 400;
            text-shadow: 0 2px 12px rgba(0,0,0,0.9);
            letter-spacing: 0.5px;
        }
        .header .badge {
            color: #8f8;
            font-size: 12px;
            background: rgba(0,0,0,0.5);
            padding: 4px 14px;
            border-radius: 20px;
            backdrop-filter: blur(4px);
            pointer-events: auto;
            border: 1px solid rgba(255,255,255,0.06);
        }

        /* ===== 场景切换按钮 ===== */
        .scene-nav {
            position: absolute;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            max-width: 92%;
            background: rgba(0,0,0,0.55);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 12px 16px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 8px 40px rgba(0,0,0,0.6);
        }
        .scene-nav button {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.08);
            color: rgba(255,255,255,0.7);
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 400;
            cursor: pointer;
            transition: all 0.25s ease;
            white-space: nowrap;
            font-family: inherit;
            letter-spacing: 0.3px;
        }
        .scene-nav button:hover {
            background: rgba(255,215,0,0.15);
            color: #fff;
            border-color: rgba(255,215,0,0.3);
            transform: translateY(-1px);
        }
        .scene-nav button.active {
            background: rgba(255,215,0,0.2);
            color: #ffd700;
            border-color: rgba(255,215,0,0.4);
            box-shadow: 0 0 20px rgba(255,215,0,0.08);
        }
        .scene-nav button .icon {
            margin-right: 4px;
        }
        .scene-nav button .loading-dot {
            display: none;
            margin-left: 6px;
            font-size: 10px;
        }
        .scene-nav button.loading .loading-dot {
            display: inline-block;
            animation: pulse 0.8s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        /* ===== 底部视角控制 ===== */
        .controls {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 14px;
            z-index: 15;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(8px);
            padding: 8px 18px;
            border-radius: 40px;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .controls button {
            background: transparent;
            border: none;
            color: rgba(255,255,255,0.6);
            font-size: 20px;
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 50%;
            transition: all 0.2s;
            line-height: 1;
        }
        .controls button:hover {
            color: #fff;
            transform: scale(1.15);
            background: rgba(255,255,255,0.08);
        }
        .controls button.active {
            color: #ffd700;
        }

        /* ===== 加载提示 ===== */
        #loadingOverlay {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            transition: opacity 0.6s ease;
        }
        #loadingOverlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top: 4px solid #ffd700;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #loadingOverlay p {
            color: #aaa;
            font-size: 14px;
            letter-spacing: 0.5px;
        }
        #loadingOverlay .sub {
            font-size: 12px;
            color: #666;
            margin-top: 6px;
        }

        /* ===== 当前场景名提示 ===== */
        .scene-indicator {
            position: absolute;
            bottom: 150px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 12;
            color: rgba(255,255,255,0.2);
            font-size: 13px;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: rgba(0,0,0,0.3);
            padding: 4px 18px;
            border-radius: 30px;
            backdrop-filter: blur(2px);
            pointer-events: none;
            transition: opacity 0.5s;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 640px) {
            .header h1 { font-size: 14px; }
            .scene-nav {
                bottom: 80px;
                padding: 10px 12px;
                gap: 6px;
                border-radius: 16px;
                max-width: 96%;
            }
            .scene-nav button {
                font-size: 12px;
                padding: 5px 12px;
            }
            .controls { padding: 6px 14px; gap: 10px; bottom: 24px; }
            .controls button { font-size: 17px; }
            .scene-indicator { bottom: 135px; font-size: 11px; padding: 2px 14px; }
        }

        /* 导航按钮中的缩略图样式 */
        .scene-nav button img {
            width: 24px;
            height: 24px;
            border-radius: 4px;
            object-fit: cover;
            vertical-align: middle;
            margin-right: 8px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* 加载中的预览图样式 */
        #previewImage {
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
        }
    </style>
</head>

        // 根据场景配置生成所有图片路径
        function getSceneImages(scene) {
            const base = `${BASE_PATH}${scene.key}/panos/${scene.no}.tiles/`;
            return {
                right: `${base}pano_r.jpg`,
                left: `${base}pano_l.jpg`,
                up: `${base}pano_u.jpg`,
                down: `${base}pano_d.jpg`,
                front: `${base}pano_f.jpg`,
                back: `${base}pano_b.jpg`,
                thumb: `${base}thumb.jpg`,
                preview: `${base}preview.jpg`,
                name: scene.name,
                icon: scene.icon
            };
        }

        // 当前场景索引
        let currentSceneIndex = 0;
        let isTransitioning = false;

        // ============================================================
        //  Three.js 初始化
        // ============================================================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a1a);
        window.scene = scene;

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 0.1);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0;
        document.body.prepend(renderer.domElement);

        // 控制器
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableZoom = true;
        controls.zoomSpeed = 0.4;
        controls.rotateSpeed = 0.6;
        controls.enablePan = false;
        controls.target.set(0, 0, 0);
        controls.minDistance = 0.1;
        controls.maxDistance = 0.2;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 1.0;

        // ============================================================
        //  全景球体管理
        // ============================================================
        let sphereMesh = null;
        const textureLoader = new THREE.TextureLoader();

        function createPanorama2(images) {
            return new Promise((resolve, reject) => {
                const loader = new THREE.CubeTextureLoader();
                loader.load(
                    [images.right, images.left, images.up, images.down, images.front, images.back],
                    (texture) => {
                        // 关键：CubeTexture 不需要设置这些，但需要确保它们被正确应用
                        // 尝试移除所有额外设置，只保留最基本的
                        //texture.needsUpdate = true;
                        // 关键校验：确保6张图像都存在
                        const allImgReady = texture.images.every(img => img instanceof HTMLImageElement);
                        if (!allImgReady) {
                            return reject(new Error("存在未正常解码的贴图"));
                        }

                        // 适配WebGL，解决texSubImage2D报错
                        texture.generateMipmaps = false;
                        texture.minFilter = THREE.LinearFilter;
                        texture.magFilter = THREE.LinearFilter;
                        
                        const geometry = new THREE.SphereGeometry(100, 64, 64);
                        const material = new THREE.MeshBasicMaterial({
                            map: texture,
                            side: THREE.BackSide,
                        });
                        const mesh = new THREE.Mesh(geometry, material);
                        resolve(mesh);

                    },
                    (xhr) => {
                        // 加载进度（可选）
                        console.log(`加载进度: ${(xhr.loaded / xhr.total * 100)}%`);
                    },
                    (err) => {
                        console.error('纹理加载失败:', err);
                        reject(err);
                    }
                );
            });
        }

        function createPanorama(images) {
            return new Promise((resolve, reject) => {
                const loader = new THREE.CubeTextureLoader();
                loader.setCrossOrigin('anonymous');
                const urls = [images.right, images.left, images.up, images.down, images.front, images.back];

                loader.load(
                    urls,
                    (cubeTexture) => {
                        cubeTexture.colorSpace = THREE.SRGBColorSpace;
                        cubeTexture.generateMipmaps = false;
                        cubeTexture.minFilter = THREE.LinearFilter;
                        cubeTexture.magFilter = THREE.LinearFilter;

                        const vertexShader = `
                            varying vec3 vDir;
                            void main() {
                                vDir = position;
                                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                            }
                        `;
                        const fragmentShader = `
                            uniform samplerCube cubeMap;
                            varying vec3 vDir;
                            void main() {
                                vec3 dir = normalize(-vDir);
                                dir.y = -dir.y;
                                dir.z = -dir.z;
                                gl_FragColor = textureCube(cubeMap, dir);
                            }
                        `;

                        const material = new THREE.ShaderMaterial({
                            uniforms: { cubeMap: { value: cubeTexture } },
                            vertexShader,
                            fragmentShader,
                            side: THREE.BackSide
                        });

                        const geometry = new THREE.SphereGeometry(100, 64, 64);
                        const mesh = new THREE.Mesh(geometry, material);
                        resolve(mesh);
                    },
                    undefined,
                    reject
                );
            })
        }

        // 切换场景
        async function switchScene(index) {
            if (isTransitioning) return;
            const sceneData = SCENES[index];
            if (!sceneData) return;
            const images = getSceneImages(sceneData);

            isTransitioning = true;
            const overlay = document.getElementById('loadingOverlay');
            const loadingName = document.getElementById('loadingSceneName');
            const indicator = document.getElementById('sceneIndicator');
            const badge = document.getElementById('sceneBadge');

            // 显示加载
            // 显示加载
            overlay.classList.remove('hidden');
            const previewImg = document.getElementById('previewImage');
            if (images.preview) {
                previewImg.src = images.preview;
                previewImg.style.display = 'block';
            } else {
                previewImg.style.display = 'none';
            }
            loadingName.textContent = `📸 ${images.icon} ${images.name}`;
            
            // 更新按钮状态
            document.querySelectorAll('.scene-nav button').forEach((btn, i) => {
                btn.classList.toggle('active', i === index);
            });

            try {
                // 加载新全景图
                const newSphere = await createPanorama(images);
                
                // 移除旧球体
                if (sphereMesh) {
                    scene.remove(sphereMesh);
                    sphereMesh.geometry.dispose();
                    sphereMesh.material.dispose();
                }
                
                // 添加新球体
                sphereMesh = newSphere;
                scene.add(sphereMesh);
                window.sphereMesh = sphereMesh;
                
                // 重置视角
                controls.target.set(0, 0, 0);
                camera.position.set(0, 0, 0.1);
                controls.update();

                // 更新UI
                currentSceneIndex = index;
                indicator.textContent = `📍 ${sceneData.icon} ${sceneData.name}`;
                badge.textContent = `● ${sceneData.name}`;

                // 在 switchScene 函数中添加调试
                console.log('球体已添加:', sphereMesh);
                console.log('球体位置:', sphereMesh.position);
                console.log('场景中的对象数量:', scene.children.length);
                
                // 隐藏加载
                setTimeout(() => {
                    overlay.classList.add('hidden');
                }, 300);

            } catch (err) {
                console.error('全景加载失败:', err);
                loadingName.textContent = '❌ 加载失败，请检查图片地址';
                // 3秒后自动隐藏
                setTimeout(() => {
                    overlay.classList.add('hidden');
                }, 2000);
            }

            isTransitioning = false;
        }

        // ============================================================
        //  生成导航按钮
        // ============================================================
        const navContainer = document.getElementById('sceneNav');
        SCENES.forEach((s, i) => {
            const btn = document.createElement('button');
            // 如果有缩略图，显示图片+文字，否则只显示图标+文字
            if (s.thumb) {
                btn.innerHTML = `<img src="${s.thumb}" style="width:20px;height:20px;border-radius:4px;object-fit:cover;vertical-align:middle;margin-right:6px;"> ${s.name}`;
            } else {
                btn.innerHTML = `<span class="icon">${s.icon}</span> ${s.name}`;
            }
            btn.dataset.index = i;
            if (i === 0) btn.classList.add('active');
            btn.addEventListener('click', () => {
                if (i !== currentSceneIndex) {
                    switchScene(i);
                }
            });
            navContainer.appendChild(btn);
        });

        // ============================================================
        //  初始化：加载第一个场景
        // ============================================================
        switchScene(0);

        // ============================================================
        //  星空背景装饰
        // ============================================================
        function addStars() {
            const vertices = [];
            for (let i = 0; i < 1500; i++) {
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                const r = 80 + Math.random() * 18;
                vertices.push(
                    r * Math.sin(phi) * Math.cos(theta),
                    r * Math.sin(phi) * Math.sin(theta),
                    r * Math.cos(phi)
                );
            }
            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
            const material = new THREE.PointsMaterial({
                color: 0x88bbff,
                size: 0.25,
                transparent: true,
                opacity: 0.5,
                blending: THREE.AdditiveBlending
            });
            const stars = new THREE.Points(geometry, material);
            scene.add(stars);
        }
        addStars();

        // ============================================================
        //  控制器按钮
        // ============================================================
        const btnAutoRotate = document.getElementById('btnAutoRotate');
        const btnReset = document.getElementById('btnReset');
        const btnFullscreen = document.getElementById('btnFullscreen');

        let isAutoRotate = true;
        btnAutoRotate.classList.add('active');

        btnAutoRotate.addEventListener('click', () => {
            isAutoRotate = !isAutoRotate;
            controls.autoRotate = isAutoRotate;
            btnAutoRotate.classList.toggle('active', isAutoRotate);
        });

        btnReset.addEventListener('click', () => {
            controls.target.set(0, 0, 0);
            camera.position.set(0, 0, 0.1);
            controls.update();
        });

        btnFullscreen.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.body.requestFullscreen().catch(() => {});
            } else {
                document.exitFullscreen();
            }
        });

        // ============================================================
        //  键盘快捷键
        // ============================================================
        document.addEventListener('keydown', (e) => {
            if (e.key === 'r' || e.key === 'R') btnAutoRotate.click();
            if (e.key === 'f' || e.key === 'F') btnFullscreen.click();
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                btnReset.click();
            }
            // 数字键快速切换场景 (1-9)
            const num = parseInt(e.key);
            if (num >= 1 && num <= SCENES.length) {
                const idx = num - 1;
                if (idx !== currentSceneIndex) switchScene(idx);
            }
        });

        // ============================================================
        //  窗口自适应
        // ============================================================
        window.addEventListener('resize', () => {
            const w = window.innerWidth;
            const h = window.innerHeight;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });

        // ============================================================
        //  渲染循环
        // ============================================================
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // 控制台提示
        console.log('🏠 多场景全景查看器已启动');
        console.log(`📌 共 ${SCENES.length} 个场景，点击下方按钮切换`);
        console.log('⌨️  快捷键: R-自动旋转 | 空格-重置视角 | F-全屏 | 数字键1-9快速切换');
    </script>
</body>
</html>
