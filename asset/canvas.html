                connectionDeleteBtn.style.left = (btnX - 14) + 'px';
                connectionDeleteBtn.style.top = (btnY - 14) + 'px';

            if (state.selectedNodeId) {

                if (prevEl) prevEl.classList.remove('selected');

        function deselectConnection() {
            if (selectedConnectionEl) {
                selectedConnectionEl.classList.remove('selected');

        function clearFlowAnimations() {
            document.querySelectorAll('.connection-line.flowing').forEach(line => {
                line.classList.remove('flowing');
            });
            clearFlowParticles();
            state.flowAnimations = [];
        }

        function clearFlowParticles() {
            flowParticles.forEach(particle => {
                if (particle && particle.element && particle.element.parentNode) {
                    particle.element.remove();
                }
            });
            flowParticles = [];
        }

        function updateFlowAnimations(nodeId) {
            clearFlowAnimations();
            if (!nodeId) return;
            
            const relevantConnections = state.connections.filter(conn => 
                conn.from === nodeId || conn.to === nodeId
            );
            
            relevantConnections.forEach(conn => {
                const path = svgLayer.querySelector(`path[data-connection="${conn.from}-${conn.to}"]`);
                if (path) {
                    path.classList.add('flowing');
                    createFlowParticles(path, conn);
                }
            });
        }

        function createFlowParticles(path, conn) {
            const pathLength = path.getTotalLength();
            const numParticles = 3;
            
            for (let i = 0; i < numParticles; i++) {
                const particle = document.createElement('div');
                particle.className = 'flow-particle';
                particle.style.position = 'absolute';
                particle.style.pointerEvents = 'none';
                particle.style.zIndex = '3';
                container.appendChild(particle);
                
                const particleData = {
                    element: particle,
                    path: path,
                    connection: conn,
                    offset: (i / numParticles) * pathLength,
                    speed: 0.5 + Math.random() * 0.5
                };
                
                flowParticles.push(particleData);
            }
            
            if (!state.particleAnimationRunning) {
                animateParticles();
            }
        }

        function animateParticles() {
            state.particleAnimationRunning = true;
            
            function update() {
                if (flowParticles.length === 0) {
                    state.particleAnimationRunning = false;
                    return;
                }
                
                const containerRect = container.getBoundingClientRect();
                
                flowParticles.forEach(data => {
                    if (!data.element || !data.path) return;
                    
                    const pathLength = data.path.getTotalLength();
                    data.offset += data.speed;
                    if (data.offset > pathLength) data.offset = 0;
                    
                    const point = data.path.getPointAtLength(data.offset);
                    data.element.style.left = (containerRect.left + point.x - 3) + 'px';
                    data.element.style.top = (containerRect.top + point.y - 3) + 'px';
                    
                    const progress = data.offset / pathLength;
                    data.element.style.opacity = progress < 0.1 ? progress * 10 : progress > 0.9 ? (1 - progress) * 10 : 1;
                });
                
                requestAnimationFrame(update);
            }
            
            requestAnimationFrame(update);
        }

            state.connections = state.connections.filter(conn => conn.from !== nodeId && conn.to !== nodeId);

        function copyNode(nodeId) {
            const sourceNode = state.nodes.find(n => n.id === nodeId);

            const newNode = { ...sourceNode, id: 'node-' + Date.now(), x: sourceNode.x + 50, y: sourceNode.y + 50 };

                alert('请先输入视频描述内容');

                if (node) {
                    node.prompt = prompt;
                }
            }
            if (!node){

                return;
            }

                alert('请选择一个视频节点');
                return;
            }
            
            // 显示加载状态

                const response = await fetch('/api/assets/generateVideo', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        prompt: prompt,
                        resolution: '1080p',
                        style: 'cinematic'
                    })
                });
                
                const result = await response.json();
                
                // 移除进度对话框
                document.body.removeChild(progressDiv);
                
                if (response.ok && result.code === 200) {
                    // 检查是否是异步任务
                    if (result.data.task_id) {
                        node.task_id = result.data.task_id;
                        node.video_id = result.data.video_id;
                        node.asssetId = result.data.asssetId;
                        node.status = 'processing';
                        // 异步任务，开始轮询
                        alert('视频生成任务已提交，开始轮询进度...');
                        pollVideoGenerationTask(result.data.task_id);
                    } else {
                        // 同步完成
                        console.log('视频生成成功:', result.data);
                        alert('✅ 视频生成成功！');
                        
                        // 更新节点
                        if (state.selectedNodeId) {
                            const node = state.nodes.find(n => n.id === state.selectedNodeId);
                            if (node) {
                                node.video_url = result.data.video_url;

                                node.task_id = result.data.task_id;
                                node.video_id = result.data.video_id;
                                node.asssetId = result.data.asssetId;
                                node.status = 'processing';
                                render();
                            }

                    }
                } else {
                    alert('生成失败: ' + (result.message || '未知错误'));
                }
            } catch (error) {
                document.body.removeChild(progressDiv);
                console.error('API 请求错误:', error);
                node.status = 'error';
                node.error = error.message;
                alert('请求失败，请检查网络连接');
            } finally {
                generateBtn.textContent = originalText;
                generateBtn.disabled = false;
            }
        }

        // ==========================================
        // 轮询视频生成任务状态
        // ==========================================

        async function pollVideoGenerationTask(taskId) {
            // 创建进度对话框
            const progressDiv = createProgressDialog('⏳ 视频生成中...', '任务 ID: ' + taskId);
            document.body.appendChild(progressDiv);
            
            let attempts = 0;
            const maxAttempts = 60; // 最多轮询 60 次
            const interval = 5000; // 每 3 秒轮询一次
            let recallFlag = true;
            const pollInterval = setInterval(async () => {
                attempts++;
                
                try {
                    if (!recallFlag){
                        return;
                    }
                    recallFlag = false;
                    const response = await fetch(`/api/assets/generateVideo/task/${taskId}`);
                    const result = await response.json();
                    recallFlag = true;
                    
                    if (response.ok && result.code === 200) {
                        const taskData = result.data;
                        
                        // 更新进度显示
                        if (taskData.progress !== undefined) {
                            updateProgressDialog(progressDiv, taskData.progress);
                        }
                        
                        if (taskData.status === 'completed' && taskData.result) {
                            // 任务完成
                            clearInterval(pollInterval);
                            document.body.removeChild(progressDiv);
                            
                            alert('✅ 视频生成完成！');
                            
                            // 更新节点
                            const node = state.nodes.find(n => n.task_id === taskId);
                            if (node) {
                                node.source_url = taskData.result.video_url || taskData.result.remixed_from_video_id;
                                node.status = 'completed';
                                node.size = taskData.result.size || null;
                                node.object = taskData.result.object || null;
                                render();
                            }
                            
                            // 刷新资产列表
                            await fetchAssets();
                        } else if (taskData.status === 'failed') {
                            // 任务失败
                            clearInterval(pollInterval);
                            document.body.removeChild(progressDiv);
                            alert('❌ 视频生成失败: ' + (taskData.error || '未知错误'));
                        }
                    }
                } catch (error) {
                    console.error('轮询任务状态失败:', error);
                }
                
                if (attempts >= maxAttempts) {
                    clearInterval(pollInterval);
                    document.body.removeChild(progressDiv);
                    alert('⏰ 视频生成超时，请稍后查看资产库');
                }
            }, interval);
        }

                            align-items:center;
                            justify-content:center;
                            transition:background 0.2s;
                        " title="最小化">─</button>
                        <button class="dialog-close-btn" style="
                            background:rgba(255,255,255,0.15);
                            border:none;
                            color:#fff;
                            width:28px;
                            height:28px;
                            border-radius:6px;
                            cursor:pointer;
                            font-size:16px;
                            display:flex;
                            align-items:center;
                            justify-content:center;
                            transition:background 0.2s;
                        " title="关闭">✕</button>
                    </div>
                </div>
                <div class="dialog-body" style="font-size:14px;color:#aaa;margin-bottom:16px;">${content}</div>
                <div class="dialog-progress" style="width:100%;height:6px;background:#333;border-radius:3px;overflow:hidden;margin:0 auto;">
                    <div class="progress-bar" style="width:0%;height:100%;background:linear-gradient(90deg,#6366f1,#8b5cf6);transition:width 0.3s;"></div>
                </div>
                <div class="dialog-progress-text" style="font-size:12px;color:#888;margin-top:8px;">处理中...</div>
            `;
            
            // 存储状态
            const dialogState = {
                element: div,
                id: id,
                isMinimized: false,
                title: title,
                content: content,
                progress: 0
            };
            progressDialogs.push(dialogState);
            
            // 最小化按钮事件
            const minimizeBtn = div.querySelector('.dialog-minimize-btn');
            minimizeBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                toggleMinimizeDialog(id);
            });
            
            // 关闭按钮事件
            const closeBtn = div.querySelector('.dialog-close-btn');
            closeBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                closeDialog(id);
            });
            
            // 双击切换最小化
            div.addEventListener('dblclick', () => {
                toggleMinimizeDialog(id);
            });
            
            // 保存引用到元素本身，方便查找
            div._dialogId = id;
            
            document.body.appendChild(div);
            return div;
        }

        function toggleMinimizeDialog(id) {
            const dialog = progressDialogs.find(d => d.id === id);
            if (!dialog) return;
            
            const el = dialog.element;
            const isMinimized = dialog.isMinimized;
            
            if (isMinimized) {
                // 恢复
                dialog.isMinimized = false;
                el.dataset.minimized = 'false';
                el.style.top = '50%';
                el.style.left = '50%';
                el.style.transform = 'translate(-50%, -50%)';
                el.style.width = '';
                el.style.padding = '24px 40px';
                el.style.borderRadius = '16px';
                el.style.cursor = 'default';
                
                // 恢复内容显示
                const body = el.querySelector('.dialog-body');
                const progress = el.querySelector('.dialog-progress');
                const progressText = el.querySelector('.dialog-progress-text');
                if (body) body.style.display = 'block';
                if (progress) progress.style.display = 'block';
                if (progressText) progressText.style.display = 'block';
                
                // 更新最小化按钮图标
                const minBtn = el.querySelector('.dialog-minimize-btn');
                if (minBtn) minBtn.textContent = '─';
                
                // 恢复 z-index
                el.style.zIndex = '1000';
            } else {
                // 最小化
                dialog.isMinimized = true;
                el.dataset.minimized = 'true';
                el.style.top = 'auto';
                el.style.left = 'auto';
                el.style.bottom = '20px';
                el.style.right = '20px';
                el.style.transform = 'none';
                el.style.width = 'auto';
                el.style.minWidth = 'auto';
                el.style.padding = '10px 16px';
                el.style.borderRadius = '12px';
                el.style.cursor = 'pointer';
                el.style.maxWidth = '300px';
                
                // 隐藏内容，只显示标题和进度
                const body = el.querySelector('.dialog-body');
                const progress = el.querySelector('.dialog-progress');
                const progressText = el.querySelector('.dialog-progress-text');
                if (body) body.style.display = 'none';
                if (progress) progress.style.display = 'none';
                if (progressText) progressText.style.display = 'none';
                
                // 在标题栏显示进度
                const headerDiv = el.querySelector('div:first-child');
                if (headerDiv) {
                    const existingStatus = headerDiv.querySelector('.minimized-status');
                    if (!existingStatus) {
                        const statusSpan = document.createElement('span');
                        statusSpan.className = 'minimized-status';
                        statusSpan.style.cssText = `
                            font-size:11px;
                            color:#10b981;
                            margin-left:8px;
                            background:rgba(16,185,129,0.2);
                            padding:2px 8px;
                            border-radius:10px;
                        `;
                        statusSpan.textContent = `${Math.round(dialog.progress)}%`;
                        headerDiv.appendChild(statusSpan);
                    }
                }
                
                // 更新最小化按钮图标
                const minBtn = el.querySelector('.dialog-minimize-btn');
                if (minBtn) minBtn.textContent = '□';
                
                // 降低 z-index
                el.style.zIndex = '999';
            }
        }

        function closeDialog(id) {
            const dialog = progressDialogs.find(d => d.id === id);
            if (dialog) {
                dialog.element.remove();
                progressDialogs = progressDialogs.filter(d => d.id !== id);
            }
        }


        function updateProgressDialog(div, progress) {
            // 查找对应的 dialog 状态
            const id = div._dialogId;
            const dialog = progressDialogs.find(d => d.id === id);
            
            const progressBar = div.querySelector('.progress-bar');
            const progressText = div.querySelector('.dialog-progress-text');
            
            if (progressBar) {
                const pct = Math.min(progress, 100);
                progressBar.style.width = pct + '%';
            }
            if (progressText) {
                progressText.textContent = `进度: ${Math.min(progress, 100)}%`;
            }
            
            // 更新状态
            if (dialog) {
                dialog.progress = Math.min(progress, 100);
                
                // 如果是最小化状态，更新状态显示
                if (dialog.isMinimized) {
                    const statusEl = div.querySelector('.minimized-status');
                    if (statusEl) {
                        statusEl.textContent = `${Math.round(dialog.progress)}%`;
                    }
                }
            }
        }

        // ==========================================
        // 保存/加载功能
        // ==========================================
        function getSaveData() {
            return {
                nodes: state.nodes.map(node => ({
                    x: Math.round(node.x * 100) / 100,
                    y: Math.round(node.y * 100) / 100,
                    ...node
                })),
                connections: state.connections.map(conn => ({
                    from: conn.from,
                    to: conn.to,
                    fromHandle: conn.fromHandle || 'out',
                    toHandle: conn.toHandle || 'in'
                })),
                viewTransform: {
                    x: Math.round(state.viewTransform.x * 100) / 100,
                    y: Math.round(state.viewTransform.y * 100) / 100,
                    scale: Math.round(state.viewTransform.scale * 100) / 100
                },
                selectedNodeId: state.selectedNodeId || null,
                gridSnap: state.gridSnap || false,
                id: inputid || null
            };
        }

        function hasChanges() {
            const currentData = getSaveData();
            if (!state.lastSaveData) return true;
            return JSON.stringify(currentData) !== JSON.stringify(state.lastSaveData);
        }

        function markChanged() {
            state.hasUnsavedChanges = true;
        }

        async function saveCanvas(showMessage = false) {
            const saveData = getSaveData();
            const saveBtn = document.getElementById('saveBtn');
            
            try {
                if (saveBtn && showMessage) {
                    saveBtn.textContent = '⏳ 保存中...';
                    saveBtn.disabled = true;
                }

                const response = await fetch('/api/assets/save-canvas', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(saveData)
                });

                if (!response.ok) throw new Error(`保存失败: ${response.status}`);

                await response.json();
                state.lastSaveData = JSON.parse(JSON.stringify(saveData));
                state.hasUnsavedChanges = false;
                console.log('画布已保存');
                updateSaveStatus(true);
                
                if (saveBtn && showMessage) {
                    saveBtn.textContent = '✅ 已保存';
                    saveBtn.style.background = '#10b981';
                    setTimeout(() => {
                        saveBtn.textContent = '💾 保存';
                        saveBtn.style.background = '#6366f1';
                        saveBtn.disabled = false;
                    }, 2000);
                }
                return true;
            } catch (error) {
                console.log('保存失败（调试模式）:', error.message);
                state.lastSaveData = JSON.parse(JSON.stringify(saveData));
                state.hasUnsavedChanges = false;
                updateSaveStatus(false);
                
                if (saveBtn && showMessage) {
                    saveBtn.textContent = '❌ 失败';
                    saveBtn.style.background = '#ef4444';
                    setTimeout(() => {
                        saveBtn.textContent = '💾 保存';
                        saveBtn.style.background = '#6366f1';
                        saveBtn.disabled = false;
                    }, 2000);
                }
                return false;
            }
        }

        function updateSaveStatus(saved) {
            const saveStatus = document.querySelector('.save-status');
            if (saveStatus) {
                if (saved) {
                    saveStatus.textContent = '● 已保存';
                    saveStatus.style.color = '#10b981';
                } else {
                    saveStatus.textContent = '● 未同步';
                    saveStatus.style.color = '#f59e0b';
                }
            }
        }

        async function loadCanvas() {
            try {
                const response = await fetch('/api/assets/canvas', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });

                if (!response.ok) throw new Error('加载失败');

                const data = await response.json();
                let firstCancas = null;
                if (data.data && Array.isArray(data.data)){
                    if (inputid) {
                        const matched = data.data.find(item => item.id === inputid);
                        firstCancas = matched || (data.data.length > 0 ? data.data[0] : {});
                    } else {
                        firstCancas = data.data.length > 0 ? data.data[0] : {};
                    }
                }else{
                    firstCancas = data.data;
                }
                applyLoadedData(firstCancas);
                await checkProcessingVideos();
                console.log('画布数据已从服务器加载');
                return true;
            } catch (error) {
                console.log('无法从服务器加载，使用默认数据');
                initMockData();
                return false;
            }
        }

        function applyLoadedData(data) {
            state.nodes = [];
            state.connections = [];
            state.selectedNodeId = null;
            clearFlowAnimations();
            deselectConnection();
            
            if (data.nodes && Array.isArray(data.nodes)) {
                data.nodes.forEach(nodeData => {
                    state.nodes.push({
                        ...nodeData
                    });
                });
            }
            
            if (data.connections && Array.isArray(data.connections)) {
                data.connections.forEach(connData => {
                    state.connections.push({
                        from: connData.from,
                        to: connData.to,
                        fromHandle: connData.fromHandle || 'out',
                        toHandle: connData.toHandle || 'in'
                    });
                });
            }
            
            if (data.viewTransform) state.viewTransform = data.viewTransform;
            if (data.gridSnap !== undefined) {
                state.gridSnap = data.gridSnap;
                const btn = document.getElementById('gridSnapBtn');
                if (btn) {
                    if (state.gridSnap) btn.classList.add('active');
                    else btn.classList.remove('active');
                }
            }
            
            state.lastSaveData = JSON.parse(JSON.stringify(getSaveData()));
            state.hasUnsavedChanges = false;
            render();
            updateZoomDisplay();
            
            if (data.selectedNodeId && state.nodes.find(n => n.id === data.selectedNodeId)) {
                setTimeout(() => selectNode(data.selectedNodeId), 100);
            }
        }

        function startAutoSave() {
            if (state.autoSaveTimer) clearInterval(state.autoSaveTimer);
            state.autoSaveTimer = setInterval(() => {
                if (hasChanges()) {
                    console.log('检测到变更，自动保存...');
                    saveCanvas(false);
                }
            }, 30000);
        }

        // 上传图片功能
        function uploadImage() {
            if (!state.selectedNodeId) return;
            
            // 创建文件选择器
            const fileInput = document.createElement('input');
            fileInput.type = 'file';
            fileInput.accept = 'image/*';
            fileInput.style.display = 'none';
            
            fileInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        const node = state.nodes.find(n => n.id === state.selectedNodeId);
                        if (node) {
                            node.img = event.target.result;
                            render();
                            markChanged();
                        }
                    };
                    reader.readAsDataURL(file);
                }
            });
            
            document.body.appendChild(fileInput);
            fileInput.click();
            document.body.removeChild(fileInput);
        }

        function renderAssetCards() {
    const content = document.getElementById('assetDialogContent');
    if (!content) return;
    
    if (filteredAssets.length === 0) {
        content.innerHTML = '<div class="asset-empty">暂无资产</div>';
        return;
    }
    
    const displayAssets = filteredAssets.slice(0, assetDisplayCount);
    
    content.innerHTML = displayAssets.map(asset => `
        <div class="asset-card ${selectedAssetId === asset.id ? 'selected' : ''}" 
             data-asset-id="${asset.id}" 
             onclick="selectAsset('${asset.id}')">
            <div class="asset-card-image">
                <img src="${asset.cover_url || ''}" 
                     alt="${asset.title || ''}" 
                     loading="lazy"
                     onerror="this.style.display='none';this.parentElement.querySelector('.placeholder').style.display='flex';"
                     onload="this.parentElement.querySelector('.placeholder').style.display='none';">
                <span class="placeholder" style="${asset.cover_url ? 'display:none;' : 'display:flex;'}">${asset.type === 'video' ? '🎬' : '🖼️'}</span>
            </div>
            <div class="asset-card-info">
                <div class="asset-card-title">${asset.title || '未命名'}</div>
                <div class="asset-card-id">${asset.id}</div>
            </div>
        </div>
    `).join('');
    
    if (assetDisplayCount < filteredAssets.length) {
        const loadMore = document.createElement('div');
        loadMore.className = 'asset-empty';
        loadMore.textContent = `还有 ${filteredAssets.length - assetDisplayCount} 个资产...`;
        loadMore.style.gridColumn = '1 / -1';
        content.appendChild(loadMore);
    }
}

            if (currentAssetTab === 'all') {
                filteredAssets = [...assetList];
            } else {
                filteredAssets = assetList.filter(asset => asset.type === currentAssetTab);
            }
            selectedAssetId = null;
            resetAssetDisplay();
            updateApplyButton();
            renderAssetCards();

        function selectAsset(id) {
            selectedAssetId = id;
            
            // 更新卡片选中状态
            document.querySelectorAll('.asset-card').forEach(card => {
                card.classList.remove('selected');
                if (card.dataset.assetId == id) card.classList.add('selected');
            });
            
            updateApplyButton();

        // 在 init 函数或启动代码中添加滚动监听
        function initAssetScrollListener() {
            const content = document.getElementById('assetDialogContent');
            if (!content) return;
            
            content.addEventListener('scroll', () => {
                const { scrollTop, scrollHeight, clientHeight } = content;
                
                // 滚动到底部时加载更多
                if (scrollTop + clientHeight >= scrollHeight - 50) {
                    if (assetDisplayCount < filteredAssets.length) {
                        assetDisplayCount += assetPageSize;
                        renderAssetCards();
                    }
                }
            });
        }

            const btn = document.getElementById('assetApplyBtn');
            if (btn) {
                btn.disabled = !selectedAssetId;
            }
        }

        function applySelectedAsset() {
            if (!selectedAssetId || !state.selectedNodeId) return;
            
            const asset = assetList.find(a => a.id == selectedAssetId);
            if (!asset) return;
            
            const node = state.nodes.find(n => n.id === state.selectedNodeId);
            if (node) {
                node.img = asset.cover_url;
                node.assetId = asset.id;
                node.title = asset.title;
                render();
                markChanged();
            }
            
            closeAssetDialog();

        // ==========================================

        function openNodeEdit(nodeId) {
            const node = state.nodes.find(n => n.id === nodeId);
            if (!node) return;
            
            // 填充表单数据
            document.getElementById('editNodeTitle').value = node.title || '';
            document.getElementById('editNodeImageName').value = node.imageName || '';
            document.getElementById('editNodeEpisodes').value = node.episodes || '';
            document.getElementById('editNodeVoice').value = node.voice || '';
            
            // 存储当前编辑的节点ID
            document.getElementById('nodeEditOverlay').dataset.nodeId = nodeId;
            
            // 定位对话框到节点右侧
            const nodeEl = document.querySelector(`.node[data-id="${nodeId}"]`);
            if (nodeEl) {
                const nodeRect = nodeEl.getBoundingClientRect();
                const overlay = document.getElementById('nodeEditOverlay');
                const dialog = overlay.querySelector('.node-edit-dialog');
                
                // 先显示才能获取尺寸
                overlay.style.display = 'flex';
                overlay.style.visibility = 'hidden';
                const dialogWidth = dialog.offsetWidth;
                const dialogHeight = dialog.offsetHeight;
                overlay.style.display = '';
                overlay.style.visibility = '';
                
                let left = nodeRect.right + 16;
                let top = nodeRect.top;
                
                // 如果右侧空间不够，放到左侧
                if (left + dialogWidth > window.innerWidth) {
                    left = nodeRect.left - dialogWidth - 16;
                }
                
                // 如果下方空间不够，向上调整
                if (top + dialogHeight > window.innerHeight) {
                    top = window.innerHeight - dialogHeight - 20;
                }
                
                // 确保不超出视口
                if (left < 0) left = 16;
                if (top < 0) top = 16;
                
                dialog.style.position = 'fixed';
                dialog.style.left = left + 'px';
                dialog.style.top = top + 'px';
                dialog.style.margin = '0';
            }
            
            // 显示对话框
            const overlay = document.getElementById('nodeEditOverlay');
            overlay.classList.add('visible');
            // 去掉遮罩背景
            overlay.style.background = 'transparent';
            overlay.style.pointerEvents = 'none';
            overlay.querySelector('.node-edit-dialog').style.pointerEvents = 'auto';
        }

            overlay.style.pointerEvents = '';
            const dialog = overlay.querySelector('.node-edit-dialog');
            dialog.style.position = '';
            dialog.style.left = '';
            dialog.style.top = '';
            dialog.style.margin = '';
            dialog.style.pointerEvents = '';

                    <div style="font-size:24px;margin-bottom:8px;">✅</div>
                    <div style="color:#10b981;">预览完成</div>
                    <div style="font-size:12px;color:#999;margin-top:4px;">音色: ${voice}</div>
                </div>`;
            }, 1500);
        }


        // ==========================================
        // 视频生成任务监控系统
        // ==========================================

        // 启动定时任务监控
        function startTaskPolling() {
            
            // 每 3 秒检查一次
            setTimeout(async () => {
                await checkProcessingVideos();
            }, 3000);
            
            console.log('定时任务监控已启动');
        }

        // 检查所有状态为 processing 的视频节点
        async function checkProcessingVideos() {
            // 找出所有状态为 processing 的视频节点
            const processingNodes = state.nodes.filter(node => 
                node.type === 'video' && node.status === 'processing'
            );
            
            if (processingNodes.length === 0) return;
            
            console.log(`发现 ${processingNodes.length} 个视频正在生成中...`);
            
            for (const node of processingNodes) {
                await checkVideoTaskStatus(node);
            }
        }

        // 检查单个视频任务状态
        async function checkVideoTaskStatus(node) {
            if (!node.task_id) {
                // 没有 taskId，可能是旧数据，直接标记为失败
                node.status = 'failed';
                node.errorMessage = '任务ID丢失';
                return;
            }
            
            await pollVideoGenerationTask(node.task_id);
        }




        // 挂载到 window
        window.openNodeEdit = openNodeEdit;
        window.closeNodeEdit = closeNodeEdit;
        window.saveNodeEdit = saveNodeEdit;
        window.previewAudio = previewAudio;

        // 挂载到 window
        window.selectFromAssetLibrary = selectFromAssetLibrary;
        window.closeAssetDialog = closeAssetDialog;
        window.switchAssetTab = switchAssetTab;
        window.selectAsset = selectAsset;
        window.applySelectedAsset = applySelectedAsset;

        // 挂载到 window
        window.uploadImage = uploadImage;

        window.zoomIn = zoomIn;
        window.zoomOut = zoomOut;
        window.resetView = resetView;
        window.fitView = fitView;
        window.addNode = addNode;
        window.handleSavePrompt = handleSavePrompt;
        window.handleGenerate = handleGenerate;
        window.handleSettings = handleSettings;
        window.toggleFullscreen = toggleFullscreen;
        window.toggleMinimap = toggleMinimap;
        window.toggleGridSnap = toggleGridSnap;
        window.saveCanvas = saveCanvas;
        window.loadCanvas = loadCanvas;

        async function init() {
            const loaded = await loadCanvas();
            if (!loaded) {
                render();
                resetView();
            }
            
            initContextMenus();
            
            connectionDeleteBtn = document.getElementById('connectionDeleteBtn');
            if (connectionDeleteBtn) {
                connectionDeleteBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (state.selectedConnection) {
                        deleteConnection(state.selectedConnection.from, state.selectedConnection.to);
                        deselectConnection();
                    }
                });
            }
            
            const addMenuFab = document.getElementById('addMenuFab');
            if (addMenuFab) {
                addMenuFab.querySelectorAll('.add-menu-item').forEach(item => {
                    item.addEventListener('click', (e) => addNode(item.dataset.type));
                });
            }
            
            const addNodeBtn = document.getElementById('addNodeBtn');
            if (addNodeBtn) {
                addNodeBtn.addEventListener('click', () => addNode());
            }
            
            startAutoSave();
            updateSaveStatus(false);
            //startTaskPolling();
        }

        init();

        container.addEventListener('wheel', (e) => {
            if (isFullscreen) return;
            e.preventDefault();
            const delta = e.deltaY > 0 ? -0.1 : 0.1;
            state.viewTransform.scale = Math.min(2, Math.max(0.2, state.viewTransform.scale + delta));
            updateZoomDisplay();
            updateAllNodePositions();
        });
    </script>
</body>
</html>
