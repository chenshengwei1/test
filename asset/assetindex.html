<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>漫剧资产库管理系统</title>
    
    <!-- ==================== 1. 样式模块 (Styles) ==================== -->
    <style>
        /* --- 1.1 全局变量与基础重置 (Variables & Reset) --- */
        :root {
            --bg-color: #f5f6fa;
            --sidebar-width: 260px;
            --primary-text: #333;
            --secondary-text: #888;
            --border-color: #e5e7eb;
            --card-radius: 12px;
            --transition: all 0.3s ease;
        }

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
        }
        
        body { 
            display: flex; 
            height: 100vh; 
            background-color: var(--bg-color); 
            overflow: hidden; 
            color: var(--primary-text); 
        }

        /* 自定义滚动条 */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #ddd; border-radius: 10px; }

        /* --- 1.2 侧边栏模块 (Sidebar) --- */
        .sidebar {
            width: var(--sidebar-width);
            background: #fff;
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border-color);
            overflow-y: auto;
        }

        .logo { 
            font-weight: 700; 
            font-size: 18px; 
            margin-bottom: 30px; 
            display: flex; 
            align-items: center; 
            gap: 10px; 
        }

        .nav-item {
            padding: 12px 12px;
            margin-bottom: 4px;
            border-radius: 8px;
            cursor: pointer;
            color: var(--secondary-text);
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: var(--transition);
        }
        .nav-item:hover { background: #f3f4f6; color: #000; }
        .nav-item.active { background: #eef2ff; color: #4f46e5; font-weight: 500; }
        
        .section-title { 
            font-size: 12px; 
            color: #aaa; 
            margin-top: 20px; 
            margin-bottom: 10px; 
            padding-left: 12px; 
        }

        .history-item {
            padding: 10px 12px;
            display: flex;
            gap: 10px;
            align-items: center;
            font-size: 13px;
            border-radius: 8px;
            cursor: pointer;
        }
        .history-item:hover { background: #f3f4f6; }
        .history-thumb { 
            width: 32px; 
            height: 32px; 
            background: #ddd; 
            border-radius: 6px; 
            object-fit: cover;
        }

        /* --- 1.3 主内容区域模块 (Main Content) --- */
        .main-content {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
            background-color: var(--bg-color);
        }

        .header-title { 
            font-size: 24px; 
            font-weight: 600; 
            margin-bottom: 20px; 
        }

        /* 工具栏 */
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            background: #fff;
            padding: 10px 16px;
            border-radius: 50px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }
        
        .tabs { display: flex; gap: 20px; }
        .tab { 
            padding: 6px 12px; 
            border-radius: 20px; 
            cursor: pointer; 
            font-size: 14px; 
            color: var(--secondary-text); 
            display: flex; 
            align-items: center; 
            gap: 6px; 
        }
        .tab.active { background: #f3f4f6; color: #000; font-weight: 500; }
        
        .controls { 
            display: flex; 
            gap: 15px; 
            font-size: 13px; 
            color: var(--secondary-text); 
            align-items: center; 
        }
        .btn-add { 
            background: #111; 
            color: #fff; 
            padding: 6px 16px; 
            border-radius: 20px; 
            border: none; 
            cursor: pointer; 
            font-size: 13px; 
        }
        .search-box { 
            background: #f5f6fa; 
            padding: 6px 12px; 
            border-radius: 20px; 
            display: flex; 
            align-items: center; 
            gap: 5px; 
        }
        .search-box input { 
            border: none; 
            background: transparent; 
            outline: none; 
            font-size: 13px; 
            width: 120px; 
        }

        /* --- 1.4 资产卡片网格模块 (Asset Grid) --- */
        .asset-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }

        .asset-card {
            background: #fff;
            border-radius: var(--card-radius);
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
            cursor: pointer;
            transition: transform 0.2s;
        }
        .asset-card:hover { transform: translateY(-4px); box-shadow: 0 8px 15px rgba(0,0,0,0.05); }

        .card-image-wrapper {
            background: #eef2f6; 
            height: 250px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card-image-wrapper img { max-width: 100%; max-height: 100%; object-fit: contain; }
        
        .card-info { padding: 12px; }
        .card-title { font-size: 14px; font-weight: 500; margin-bottom: 4px; }
        .card-date { font-size: 12px; color: #aaa; }

        /* 新增卡片按钮样式 */
        .add-card {
            background: #e5e7eb;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: var(--secondary-text);
            height: 100%;
            min-height: 250px; 
            border: 2px dashed transparent;
            transition: all 0.2s;
        }
        .add-card:hover { border-color: #aaa; background: #dcdfe5; }
        .add-icon { 
            width: 40px; 
            height: 40px; 
            background: #000; 
            border-radius: 50%; 
            color: #fff; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 20px; 
            margin-bottom: 10px; 
        }

        /* --- 1.5 弹窗模块 (Modal) --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4);
            display: none; justify-content: center; align-items: center;
            z-index: 100;
        }
        .modal-overlay.show { display: flex; }

        .modal {
            background: #fff;
            width: 700px;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }
        .modal h2 { margin-bottom: 10px; font-size: 20px; }
        .modal p { color: #888; margin-bottom: 20px; font-size: 14px; }
        
        .modal-options { display: flex; gap: 20px; }
        .modal-option {
            flex: 1;
            background: #f7f8fa;
            padding: 40px 20px;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            border: 1px solid transparent;
            transition: 0.2s;
        }
        .modal-option:hover { border-color: #ddd; background: #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .modal-option .icon { margin-bottom: 10px; font-size: 24px; }
        .modal-option h3 { font-size: 16px; margin-bottom: 4px; }
        .modal-option span { font-size: 12px; color: #888; }

        .close-modal {
            float: right; 
            font-size: 24px; 
            cursor: pointer; 
            color: #aaa;
        }

        /* --- 1.6 详情侧边栏模块 (Detail Panel) --- */
        .detail-panel {
            position: fixed;
            right: 0; top: 0; width: 500px; height: 100%;
            background: #fff;
            box-shadow: -5px 0 15px rgba(0,0,0,0.05);
            padding: 30px;
            transform: translateX(100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 99;
            overflow-y: auto;
        }
        .detail-panel.open { transform: translateX(0); }
        
        .detail-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .detail-content img { width: 100%; background: #f3f4f6; border-radius: 12px; margin-bottom: 20px; }
        .detail-field { margin-bottom: 15px; }
        .detail-field label { font-size: 12px; color: #888; display: block; }
        .detail-field div { font-size: 14px; font-weight: 500; margin-top: 4px; }
        
        .detail-actions { 
            margin-top: 40px; 
            border-top: 1px solid #eee; 
            padding-top: 20px;
            display: flex; 
            justify-content: flex-end; 
            gap: 10px;
        }
        .btn { padding: 8px 20px; border-radius: 20px; border: none; cursor: pointer; font-size: 13px; }
        .btn-black { background: #000; color: #fff; }
        .btn-ghost { background: transparent; border: 1px solid #ddd; }

        /* --- 1.7 加载状态模块 (Loading States) --- */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* --- 1.8 资产库选择对话框模块 (Asset Dialog) --- */
        .asset-dialog-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1001;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .asset-dialog-overlay.visible {
            display: flex;
        }

        .asset-dialog {
            background: #fff;
            border-radius: 16px;
            width: 66.67vw;
            height: 66.67vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .asset-dialog-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            border-bottom: 1px solid #e5e7eb;
        }

        .asset-dialog-header h3 {
            margin: 0;
            font-size: 16px;
            color: #333;
        }

        .asset-dialog-close {
            width: 32px;
            height: 32px;
            border: none;
            background: #f3f4f6;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: #666;
            transition: all 0.2s;
        }

        .asset-dialog-close:hover {
            background: #e5e7eb;
            color: #333;
        }

        .asset-dialog-tabs {
            display: flex;
            gap: 0;
            padding: 0 24px;
            border-bottom: 1px solid #e5e7eb;
        }

        .asset-dialog-tab {
            padding: 10px 20px;
            cursor: pointer;
            font-size: 13px;
            color: #666;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
            background: none;
            border-top: none;
            border-left: none;
            border-right: none;
        }

        .asset-dialog-tab:hover {
            color: #6366f1;
        }

        .asset-dialog-tab.active {
            color: #6366f1;
            border-bottom-color: #6366f1;
        }

        .asset-dialog-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 16px;
            align-content: start;
        }

        .asset-card {
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.2s;
            background: #fff;
        }

        .asset-card:hover {
            border-color: #6366f1;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.15);
        }

        .asset-card.selected {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        .asset-card-image {
            width: 100%;
            height: 120px;
            background: #f9fafb;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .asset-card-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .asset-card-image .placeholder {
            color: #ccc;
            font-size: 32px;
        }

        .asset-card-info {
            padding: 8px 12px;
            border-top: 1px solid #f3f4f6;
        }

        .asset-card-title {
            font-size: 12px;
            color: #333;
            font-weight: 500;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .asset-card-id {
            font-size: 10px;
            color: #999;
            margin-top: 2px;
        }

        .asset-dialog-footer {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            padding: 16px 24px;
            border-top: 1px solid #e5e7eb;
        }

        .asset-dialog-footer button {
            padding: 8px 20px;
            border-radius: 20px;
            border: none;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }

        .asset-dialog-footer .btn-cancel {
            background: #f3f4f6;
            color: #333;
        }

        .asset-dialog-footer .btn-cancel:hover {
            background: #e5e7eb;
        }

        .asset-dialog-footer .btn-apply {
            background: #6366f1;
            color: #fff;
        }

        .asset-dialog-footer .btn-apply:hover {
            background: #4f46e5;
        }

        .asset-dialog-footer .btn-apply:disabled {
            background: #c7d2fe;
            cursor: not-allowed;
        }

        /* 空状态 */
        .asset-empty {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px;
            color: #999;
            font-size: 14px;
        }

        /* 详情面板内的输入框样式 */
        .detail-field input[type="text"],
        .detail-field select,
        .detail-field textarea {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            font-size: 14px;
            margin-top: 4px;
            background: #f9fafb;
            transition: all 0.3s;
            font-family: inherit;
        }

        .detail-field input[type="text"]:disabled,
        .detail-field select:disabled,
        .detail-field textarea:disabled {
            background: transparent;
            border-color: transparent;
            color: var(--primary-text);
            padding-left: 0;
            cursor: default;
            opacity: 1;
        }

        .detail-field input[type="text"]:not(:disabled),
        .detail-field select:not(:disabled),
        .detail-field textarea:not(:disabled) {
            background: #fff;
            border-color: #d1d5db;
        }

        .detail-field input[type="text"]:not(:disabled):focus,
        .detail-field select:not(:disabled):focus,
        .detail-field textarea:not(:disabled):focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .detail-field textarea {
            resize: vertical;
            min-height: 80px;
        }

        /* 右键菜单样式 */
        #contextMenu div {
            transition: background 0.15s;
        }

        #contextMenu div:hover {
            background: #f3f4f6;
        }

        .tag-select-wrapper { position: relative; width: 100%; max-width: 500px; font-family: Arial, sans-serif; }
        .tag-input-box { border: 1px solid #d9d9d9; border-radius: 4px; padding: 4px 8px; display: flex; flex-wrap: wrap; align-items: center; background: #fff; min-height: 36px; box-sizing: border-box; cursor: text; transition: all 0.3s; }
        .tag-input-box:hover { border-color: #409EFF; }
        .tag-input-box:focus-within { border-color: #409EFF; box-shadow: 0 0 0 2px rgba(64, 158, 255, 0.2); }
        .tag-item { display: flex; align-items: center; background-color: #f4f4f5; border: 1px solid #e9e9eb; color: #606266; font-size: 12px; padding: 0 10px; height: 24px; border-radius: 4px; margin: 2px 4px 2px 0; box-sizing: border-box; white-space: nowrap; }
        .tag-item .close-btn { margin-left: 6px; cursor: pointer; color: #909399; font-weight: bold; }
        .tag-item .close-btn:hover { color: #f56c6c; }
        .tag-input { border: none; outline: none; height: 24px; line-height: 24px; font-size: 14px; flex-grow: 1; min-width: 60px; padding: 0; }
        .dropdown-list { position: absolute; top: 100%; left: 0; right: 0; max-height: 200px; overflow-y: auto; border: 1px solid #e4e7ed; border-radius: 4px; background: #fff; box-shadow: 0 2px 12px 0 rgba(0,0,0,0.1); margin-top: 4px; display: none; z-index: 100; }
        .dropdown-list.show { display: block; }
        .dropdown-item { padding: 8px 12px; cursor: pointer; color: #606266; font-size: 14px; }
        .dropdown-item:hover { background-color: #f5f7fa; }
        .dropdown-item.create-item { color: #409EFF; }
        .dropdown-item.disabled { color: #909399; cursor: default; }
        /* 禁用状态下的标签样式优化 */
        .tag-select-wrapper.disabled .tag-item {
            background-color: #f0f0f0;
            border-color: #d9d9d9;
            color: #909399;
            cursor: not-allowed;
        }

        /* 禁用状态下输入框隐藏后的容器样式 */
        .tag-select-wrapper.disabled .tag-input-box {
            padding: 4px 8px;
            min-height: 36px;
        }

        /* 批量选择模式样式 */
.asset-card.batch-mode {
    cursor: pointer;
    position: relative;
}

.asset-card.batch-mode .batch-checkbox {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 2px solid #ddd;
    background: white;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2;
    transition: all 0.2s;
    cursor: pointer;
}

.asset-card.batch-mode .batch-checkbox.checked {
    background: #6366f1;
    border-color: #6366f1;
    color: white;
}

.asset-card.batch-mode .batch-checkbox.checked::after {
    content: '✓';
    font-size: 14px;
    color: white;
}

.asset-card.batch-mode.selected {
    border: 2px solid #6366f1;
    box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
}
    </style>
    
    <!-- Font Awesome 图标库 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <!-- ==================== 2. 结构模块 (Structure) ==================== -->
    
    <!-- 2.1 侧边栏导航 -->
    <div class="sidebar">
        <div class="logo">
            <span style="background:#000; color:#fff; padding:2px 8px; border-radius:4px;">Q</span> 小云雀
        </div>

        <div class="nav-item">
            <i class="fas fa-plus-circle"></i> 创作
        </div>
        <div class="nav-item">
            <i class="fas fa-robot"></i> 短剧 Agent
        </div>
        <div class="nav-item active" onclick="showView('assets')">
            <i class="fas fa-folder-open"></i> 资产
        </div>

        <div class="section-title">创作历史</div>
        <div class="history-item">
            <img src="https://placehold.co/32x32/333/fff?text=H" class="history-thumb">
            <div>
                <div style="font-weight:500; font-size:12px;">古典舞角色展示</div>
                <div style="font-size:11px; color:#999;">全能创作Agent</div>
            </div>
        </div>
        <div class="history-item">
            <img src="https://placehold.co/32x32/333/fff?text=U" class="history-thumb">
            <div>
                <div style="font-weight:500; font-size:12px;">使用上传的角色...</div>
                <div style="font-size:11px; color:#999;">短剧 Agent</div>
            </div>
        </div>
    </div>

    <!-- 2.2 主内容区域 -->
    <div class="main-content" id="main-content">
        <h1 class="header-title">资产库</h1>

        <div class="toolbar">
            <div class="tabs">
                <div class="tab active"><i class="fas fa-all"></i> 全部</div>
                <div class="tab"><i class="fas fa-image"></i> 素材</div>
                <div class="tab"><i class="fas fa-video"></i> 视频</div>
                <div class="tab"><i class="fas fa-user"></i> 角色</div>
                <div class="tab"><i class="fas fa-paint-brush"></i> 画布</div>
            </div>
            <div class="controls">
                <button class="btn-add" onclick="openModal()">+ 新增</button>
                <!-- ===== 新增：批量操作按钮 ===== -->
                <button class="btn-add" onclick="toggleBatchMode()" style="background: #6366f1;">
                    <i class="fas fa-check-double"></i> 批量
                </button>
                <button class="btn-add" id="batchTagBtn" onclick="openBatchTagDialog()" style="background: #10b981; display: none;">
                    <i class="fas fa-tags"></i> 设置标签
                </button>
                <!-- ===== 新增结束 ===== -->
                <div id="searchTag"></div>
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" placeholder="搜索素材...">
                </div>
                <span><i class="fas fa-clock"></i> 按时间倒序</span>
                <span><i class="fas fa-th-large"></i></span>
            </div>
        </div>

        <!-- 资产卡片网格容器 -->
        <div class="asset-grid" id="asset-grid"></div>
    </div>

    <!-- 2.3 创建角色弹窗 -->
    <div class="modal-overlay" id="createModal">
        <div class="modal">
            <span class="close-modal" onclick="closeModal()">×</span>
            <h2>创建角色</h2>
            <p>选择一种方式创建你的角色资产。</p>
            <div class="modal-options">

    <!-- ==================== 3. 脚本逻辑模块 (Scripts) ==================== -->
    <script type="module">

        // ============================================================
        // 0. 日志系统模块 (Logging System)
        // ============================================================
        const UI_LOGGER = {
            enabled: true,
            logLevel: 'debug', // debug, info, warn, error
            module: 'UI',

            _format(level, message, data) {
                const timestamp = new Date().toISOString();
                const prefix = `[${timestamp}] [${this.module}] [${level.toUpperCase()}]`;
                if (data !== undefined) {
                    return { prefix, message, data };
                }
                return { prefix, message };
            },

            debug(message, data) {
                if (!this.enabled || !['debug', 'info', 'warn', 'error'].includes(this.logLevel)) return;
                const formatted = this._format('debug', message, data);
                if (data !== undefined) {
                    console.debug(formatted.prefix, formatted.message, data);
                } else {
                    console.debug(formatted.prefix, formatted.message);
                }
            },

            info(message, data) {
                if (!this.enabled || !['info', 'warn', 'error'].includes(this.logLevel)) return;
                const formatted = this._format('info', message, data);
                if (data !== undefined) {
                    console.info(formatted.prefix, formatted.message, data);
                } else {
                    console.info(formatted.prefix, formatted.message);
                }
            },

            warn(message, data) {
                if (!this.enabled || !['warn', 'error'].includes(this.logLevel)) return;
                const formatted = this._format('warn', message, data);
                if (data !== undefined) {
                    console.warn(formatted.prefix, formatted.message, data);
                } else {
                    console.warn(formatted.prefix, formatted.message);
                }
            },

            error(message, error) {
                if (!this.enabled) return;
                const formatted = this._format('error', message);
                if (error) {
                    console.error(formatted.prefix, formatted.message, error);
                } else {
                    console.error(formatted.prefix, formatted.message);
                }
            },

            group(name, fn) {
                if (!this.enabled) return fn();
                console.group(`[${this.module}] ${name}`);
                try {
                    fn();
                } finally {
                    console.groupEnd();
                }
            },

            time(label, fn) {
                if (!this.enabled) return fn();
                console.time(`[${this.module}] ${label}`);
                try {
                    return fn();
                } finally {
                    console.timeEnd(`[${this.module}] ${label}`);
                }
            },

            async timeAsync(label, fn) {
                if (!this.enabled) return await fn();
                console.time(`[${this.module}] ${label}`);
                try {
                    return await fn();
                } finally {
                    console.timeEnd(`[${this.module}] ${label}`);
                }
            }
        };

        console.log('[UI] 日志系统已初始化');

        // 从上级目录导入
        import { AssetService } from '../asset.service.js';
        import {TagSelect} from './TagSelect.js'

        UI_LOGGER.info('AssetService 导入完成');

        // 自动从根目录加载 config.json
        // 注意：在子目录中，/config.json 依然指向根目录
        const assetService = new AssetService();
        UI_LOGGER.debug('AssetService 实例已创建');

        // 初始化
        assetService.init();
        UI_LOGGER.info('AssetService 初始化已触发');
        
        
        // ------------------------------------------------------------
        // 3.1 全局状态管理 (State Management)
        // ------------------------------------------------------------
        let assetsData = [];          // 普通资产数据
        let canvasAssetsData = [];    // 画布资产数据
        UI_LOGGER.debug('全局状态已初始化', { assetsData: assetsData.length, canvasAssetsData: canvasAssetsData.length });
        
        // 筛选与分页状态
        let currentFilter = {
            type: 'all',
            keyword: '',
            sort: 'time_desc',
            page: 1,
            pageSize: 20
        };
        UI_LOGGER.debug('当前筛选条件', currentFilter);

        // API 基础路径
        const API_BASE = 'https://chenshengwei1.github.io/';
        let isEditing = false; // 是否处于编辑状态
        UI_LOGGER.debug('编辑状态初始化', { isEditing });

        let tagSelect = null;
        let searchTagSelect = null;
        let currentSearchedTags = [];
        UI_LOGGER.debug('标签组件引用已初始化');

        // ==================== 批量操作模块 ====================
        let batchMode = false;
        let selectedAssets = new Set(); // 存储选中的资产ID
        UI_LOGGER.debug('批量模式初始化', { batchMode, selectedAssets: selectedAssets.size });

        /**
        * 切换批量选择模式
        */
        function toggleBatchMode() {
            UI_LOGGER.info('toggleBatchMode 被调用', { currentBatchMode: batchMode });
            batchMode = !batchMode;
            selectedAssets.clear();
            UI_LOGGER.debug('批量模式切换后', { batchMode, selectedAssets: selectedAssets.size });
            
            const batchBtn = document.querySelector('.controls .btn-add:nth-child(2)');
            const tagBtn = document.getElementById('batchTagBtn');
            
            if (batchMode) {
                UI_LOGGER.debug('进入批量模式');
                batchBtn.textContent = '退出批量';
                batchBtn.style.background = '#ef4444';
                tagBtn.style.display = 'inline-block';
                // 添加批量模式类到所有卡片
                const cards = document.querySelectorAll('.asset-card:not(.add-card)');
                UI_LOGGER.debug(`找到 ${cards.length} 个卡片需要添加批量模式`);
                cards.forEach(card => {
                    card.classList.add('batch-mode');
                    addCheckboxToCard(card);
                });

                // ===== 新增：关闭可能打开的详情面板 =====
                closeDetail();
                UI_LOGGER.debug('已关闭详情面板');
            } else {
                UI_LOGGER.debug('退出批量模式');
                batchBtn.textContent = '批量';
                batchBtn.style.background = '#6366f1';
                tagBtn.style.display = 'none';
                // 移除批量模式类
                const cards = document.querySelectorAll('.asset-card.batch-mode');
                UI_LOGGER.debug(`移除 ${cards.length} 个卡片的批量模式`);
                cards.forEach(card => {
                    card.classList.remove('batch-mode');
                    const checkbox = card.querySelector('.batch-checkbox');
                    if (checkbox) checkbox.remove();
                });

                 // ===== 新增：移除选中样式 =====
                document.querySelectorAll('.asset-card.selected').forEach(card => {
                    card.classList.remove('selected');
                });
                UI_LOGGER.debug('已移除所有选中样式');
            }

            updateSelectedCount();
            UI_LOGGER.debug('toggleBatchMode 完成');
        }

        /**
        * 为卡片添加复选框
        */
        function addCheckboxToCard(card) {
            // 检查是否已经有复选框
            if (card.querySelector('.batch-checkbox')) return;
            
            const checkbox = document.createElement('div');
            checkbox.className = 'batch-checkbox';
            checkbox.dataset.id = card.dataset.assetId;
            UI_LOGGER.debug(`为卡片添加复选框: ${card.dataset.assetId}`);
            
            // 点击复选框切换选中状态
            checkbox.addEventListener('click', function(e) {
                e.stopPropagation();
                UI_LOGGER.debug(`复选框点击: ${this.dataset.id}`);
                toggleAssetSelection(this.dataset.id);
            });
            
            // 点击卡片切换选中状态
            card.addEventListener('click', function(e) {
                // 如果点击的是复选框本身，已经在上面的监听中处理了
                if (e.target.closest('.batch-checkbox')) return;
                const id = this.dataset.assetId;
                if (id) {
                    UI_LOGGER.debug(`卡片点击: ${id}`);
                    toggleAssetSelection(id);
                }
            });
            
            card.appendChild(checkbox);

            // ===== 新增：如果该卡片已被选中，恢复选中状态 =====
            if (selectedAssets.has(card.dataset.assetId)) {
                checkbox.classList.add('checked');
                card.classList.add('selected');
                UI_LOGGER.debug(`恢复卡片选中状态: ${card.dataset.assetId}`);
            }
        }

        /**
        * 切换资产选中状态
        */
        function toggleAssetSelection(assetId) {
            if (!assetId) {
                UI_LOGGER.warn('toggleAssetSelection 收到空ID');
                return;
            }
            
            UI_LOGGER.debug(`切换资产选中状态: ${assetId}`, { 
                currentlySelected: selectedAssets.has(assetId),
                totalSelected: selectedAssets.size 
            });
            
            if (selectedAssets.has(assetId)) {
                selectedAssets.delete(assetId);
                UI_LOGGER.debug(`取消选中: ${assetId}`);
            } else {
                selectedAssets.add(assetId);
                UI_LOGGER.debug(`选中: ${assetId}`);
            }
            
            // 更新复选框UI
            const card = document.querySelector(`.asset-card[data-asset-id="${assetId}"]`);
            if (card) {
                const checkbox = card.querySelector('.batch-checkbox');
                if (checkbox) {
                    if (selectedAssets.has(assetId)) {
                        checkbox.classList.add('checked');
                        card.classList.add('selected');
                    } else {
                        checkbox.classList.remove('checked');
                        card.classList.remove('selected');
                    }
                }
            } else {
                UI_LOGGER.warn(`未找到资产卡片: ${assetId}`);
            }
            
            updateSelectedCount();
        }

        /**
        * 更新选中数量显示
        */
        function updateSelectedCount() {
            const count = selectedAssets.size;
            UI_LOGGER.debug(`更新选中数量: ${count}`);
            const countDisplay = document.getElementById('selectedCount');
            if (countDisplay) {
                countDisplay.textContent = count;
            }
            
            // 更新按钮文本
            const tagBtn = document.getElementById('batchTagBtn');
            if (tagBtn) {
                tagBtn.innerHTML = `<i class="fas fa-tags"></i> 设置标签 (${count})`;
            }
        }

        /**
        * 打开批量设置标签对话框
        */
        function openBatchTagDialog() {
            UI_LOGGER.info('openBatchTagDialog 被调用', { selectedCount: selectedAssets.size });
            if (selectedAssets.size === 0) {
                UI_LOGGER.warn('没有选中的资产，无法打开批量标签对话框');
                alert('请先选择要操作的资产');
                return;
            }
            
            document.getElementById('batchTagModal').classList.add('show');
            updateSelectedCount();
            UI_LOGGER.debug('批量标签对话框已打开');
            
            // 初始化或重置标签选择组件
            if (!window.batchTagSelect) {
                UI_LOGGER.debug('初始化批量标签选择组件');
                window.batchTagSelect = new TagSelect('#batchTagInput', {
                    placeholder: '请选择或输入标签'
                });
                // 获取所有可用标签
                fetchAllTags().then(tags => {
                    UI_LOGGER.debug(`获取到 ${tags.length} 个标签用于批量选择`);
                    window.batchTagSelect.setItems(tags);
                });
            } else {
                window.batchTagSelect.setSelected([]);
                UI_LOGGER.debug('重置批量标签选择组件');
            }
        }

        /**
        * 关闭批量标签对话框
        */
        function closeBatchTagDialog() {
            UI_LOGGER.debug('关闭批量标签对话框');
            document.getElementById('batchTagModal').classList.remove('show');
        }

        /**
        * 应用批量标签
        */
        async function applyBatchTags() {
            UI_LOGGER.info('applyBatchTags 被调用');
            if (!window.batchTagSelect) {
                UI_LOGGER.error('批量标签选择组件未初始化');
                return;
            }
            
            const tags = window.batchTagSelect.getSelected();
            UI_LOGGER.debug('选中的标签', { tags });
            if (tags.length === 0) {
                UI_LOGGER.warn('未选择标签');
                alert('请选择至少一个标签');
                return;
            }
            
            const assetIds = Array.from(selectedAssets);
            UI_LOGGER.debug(`将为 ${assetIds.length} 个资产设置标签`, { assetIds, tags });
            if (assetIds.length === 0) {
                UI_LOGGER.warn('没有选中的资产');
                alert('没有选中的资产');
                return;
            }
            
            try {
                UI_LOGGER.info('开始批量设置标签');
                showLoading(true);
                const result = await assetService.batchSetTags(assetIds, tags);
                UI_LOGGER.debug('批量标签API响应', { result });
                
                if (result.code === 200) {
                    UI_LOGGER.info(`成功为 ${assetIds.length} 个资产设置标签`);
                    alert(`成功为 ${assetIds.length} 个资产设置标签`);
                    closeBatchTagDialog();
                    
                    // 刷新当前视图
                    if (currentFilter.type === 'canvas') {
                        await fetchCanvasAssets();
                    } else {
                        await fetchAssets();
                    }
                    
                    // 退出批量模式
                    toggleBatchMode();
                } else {
                    UI_LOGGER.error('批量设置失败', { message: result.message });
                    alert('批量设置失败: ' + (result.message || '未知错误'));
                }
            } catch (error) {
                UI_LOGGER.error('批量设置标签失败', error);
                alert('批量设置失败，请重试');
            } finally {
                showLoading(false);
                UI_LOGGER.debug('applyBatchTags 完成');
            }
        }

        /**
        * 获取所有可用标签
        */
        async function fetchAllTags() {
            UI_LOGGER.debug('fetchAllTags 被调用');
            try {
                const result = await assetService.getTags();
                if (result.code === 200) {
                    const tags = result.data.map(tag => tag.name || tag);
                    UI_LOGGER.debug(`获取到 ${tags.length} 个标签`);
                    return tags;
                }
            } catch (error) {
                UI_LOGGER.error('获取标签失败', error);
            }
            return [];
        }


        // ------------------------------------------------------------
        // 3.2 工具函数 (Utility Functions)
        // ------------------------------------------------------------
        
        /**
         * 防抖函数，用于优化搜索输入等高频操作
         */
        function debounce(func, wait) {
            UI_LOGGER.debug('创建防抖函数', { wait });
            let timeout;
            return function executedFunction(...args) {
                const later = () => {
                    clearTimeout(timeout);
                    func(...args);
                };
                clearTimeout(timeout);
                timeout = setTimeout(later, wait);
            };
        }

        /**
         * 显示或隐藏全局加载状态
         */
        function showLoading(show) {
            UI_LOGGER.debug(`设置加载状态: ${show}`);
            const loader = document.getElementById('loadingIndicator') || (() => {
                UI_LOGGER.debug('创建加载指示器');
                const div = document.createElement('div');
                div.id = 'loadingIndicator';
                div.style.cssText = 'position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.7); color: white; padding: 20px; border-radius: 8px; z-index: 1000;';
                div.innerHTML = '加载中...';
                document.body.appendChild(div);
                return div;
            })();
            
            loader.style.display = show ? 'block' : 'none';
        }

        // ------------------------------------------------------------
        // 3.3 视图切换与弹窗控制 (View & Modal Control)
        // ------------------------------------------------------------
        
        function showView(viewName) {
            UI_LOGGER.info('showView 被调用', { viewName });
            console.log('Switching to', viewName);
        }

        function openModal() {
            UI_LOGGER.info('openModal 被调用');
            document.getElementById('createModal').classList.add('show');
            UI_LOGGER.debug('创建弹窗已打开');

            // ===== 新增：重置标签选择 =====
            if (window.createTagSelect) {
                window.createTagSelect.setSelected([]);
                UI_LOGGER.debug('创建弹窗标签选择器已重置');
            }
            
            const modalOptions = document.querySelector('.modal-options');
            modalOptions.innerHTML = `
                <div class="modal-option" onclick="document.getElementById('fileInput').click()">
                    <div class="icon"><i class="fas fa-upload" style="font-size: 24px;"></i></div>
                    <h3>上传角色图片</h3>
                    <span>添加宠物、二次元形象...</span>
                    <input type="file" id="fileInput" accept="image/*" multiple style="display:none">
                </div>
                <div class="modal-option" onclick="openAIGeneration()">
                    <div class="icon"><i class="fas fa-magic" style="font-size: 24px;"></i></div>
                    <h3>AI 生成角色</h3>
                    <span>输入描述，参考指定风格生成</span>

        // 保存详情修改
        async function saveDetail() {
            UI_LOGGER.info('saveDetail 被调用');
            const panel = document.getElementById('detailPanel');
            const id = panel.dataset.assetId;
            const assetType = panel.dataset.assetType || 'normal';
            
            UI_LOGGER.debug('保存参数', { id, assetType });
            
            if (!id && assetType !== 'canvas') {
                UI_LOGGER.warn('未找到资产ID');
                alert('未找到资产ID');
                return;
            }
            
            const updatedData = {
                title: document.getElementById('detailName').value,
                visibility: document.getElementById('detailVisibility').value,
                description: document.getElementById('detailDescription').value,
                tags: Array.from(tagSelect.getSelected()).join(',')
            };
            UI_LOGGER.debug('更新的数据', updatedData);
            
            try {
                UI_LOGGER.info('开始保存修改');
                showLoading(true);
                
                let result;
                
                // 根据资产类型调用不同的 API
                if (assetType === 'canvas') {
                    UI_LOGGER.debug('保存画布资产');
                    result = await assetService.saveCanvas({
                        id: id,
                        ...updatedData
                    });
                } else {
                    UI_LOGGER.debug('保存普通资产');
                    result = await assetService.updateAsset(id, updatedData);
                }
                
                UI_LOGGER.debug('保存API响应', { result });
                
                if (result.code === 200) {
                    isEditing = false;
                    setEditMode(false);
                    UI_LOGGER.info('保存成功');
                    
                    // 刷新对应的资产列表
                    if (assetType === 'canvas') {
                        await fetchCanvasAssets();
                    } else {
                        await fetchAssets();

                    alert('保存成功！');
                } else {
                    UI_LOGGER.error('保存失败', { message: result.message });
                    alert('保存失败: ' + (result.message || '未知错误'));
                }
            } catch (error) {
                UI_LOGGER.error('保存错误', error);
                alert('保存失败，请重试');
            } finally {
                showLoading(false);
                UI_LOGGER.debug('saveDetail 完成');
            }
        }

        // ------------------------------------------------------------
        // 3.6 API 服务模块 (API Services)

        async function fetchAssets(params = {}) {
            UI_LOGGER.info('fetchAssets 被调用', { params, currentFilter });
            try {
                const queryParams = { ...currentFilter, ...params };
                queryParams.pageSize = 200;
                const queryString = Object.entries(queryParams)
                    .filter(([key, value]) => value !== undefined && value !== '')
                    .map(([key, value]) => `${key}=${encodeURIComponent(value)}`)
                    .join('&');
                UI_LOGGER.debug('查询参数', { queryString });

                console.log('getAssets call');
                const newResult = await assetService.getAssets(queryParams);
                UI_LOGGER.debug('API响应', { code: newResult.code, total: newResult.data?.total });
                
                if (newResult.code === 200) {
                    assetsData = newResult.data.list;
                    currentFilter = { ...currentFilter, ...params };
                    UI_LOGGER.debug(`获取到 ${assetsData.length} 个资产`);
                    renderAssets(assetsData);
                    return assetsData;
                } else {
                    UI_LOGGER.error('获取资产失败', { message: newResult.message });
                    return [];
                }
            } catch (error) {
                UI_LOGGER.error('API请求错误', error);
                return [];
            }
        }

                if (result.code === 200) {

                    return [];
                }

                return [];
            }
        }

        async function uploadAsset(file, metadata = {}) {
            UI_LOGGER.info('uploadAsset 被调用', { fileName: file?.name, fileSize: file?.size, metadata });
            try {
                const formData = new FormData();
                formData.append('file', file);
                formData.append('title', metadata.title || '未命名素材');
                formData.append('type', metadata.type || 'material');
                formData.append('source_type', metadata.source_type || 'upload');
                if (metadata.tags) formData.append('tags', metadata.tags);
                if (metadata.description) formData.append('description', metadata.description);
                UI_LOGGER.debug('FormData 已构建', { title: metadata.title });

                const result = await assetService.createAsset(formData);
                UI_LOGGER.debug('API响应', { code: result.code, assetId: result.data?.id });
                
                if (result.code === 200) {
                    UI_LOGGER.info(`上传成功: ${result.data?.id}`);
                    await fetchAssets();
                    return result.data;
                } else {
                    UI_LOGGER.error('上传失败', { message: result.message });
                    return null;
                }
            } catch (error) {
                UI_LOGGER.error('上传错误', error);
                return null;
            }
        }

                UI_LOGGER.error('获取历史记录失败', error);
            }
        }

        async function fetchTags() {
            UI_LOGGER.debug('fetchTags 被调用');
            try {
                const result = await assetService.getTags();
                UI_LOGGER.debug('API响应', { code: result.code, count: result.data?.length });
                if (result.code === 200) return result.data;

                UI_LOGGER.error('获取标签失败', error);

        async function generateCharacter(prompt, style = 'default') {
            UI_LOGGER.info('generateCharacter 被调用', { prompt, style });
            try {
                const result = await assetService.generateCharacter({ prompt, style });
                UI_LOGGER.debug('API响应', { code: result.code, taskId: result.data?.task_id });
                
                if (result.code === 200) {
                    return pollGenerationStatus(result.data.task_id);
                } else {
                    UI_LOGGER.error('生成失败', { message: result.message });
                    return null;
                }
            } catch (error) {
                UI_LOGGER.error('生成错误', error);
                return null;
            }
        }

        async function pollGenerationStatus(taskId, interval = 2000, maxAttempts = 30) {
            UI_LOGGER.info('pollGenerationStatus 开始轮询', { taskId, interval, maxAttempts });
            let attempts = 0;
            
            return new Promise((resolve, reject) => {
                const checkStatus = async () => {
                    try {
                        const result = await assetService.getGenerateTaskStatus(taskId);
                        UI_LOGGER.debug(`轮询第 ${attempts + 1} 次`, { status: result.data?.status, progress: result.data?.progress });
                        
                        if (result.code === 200) {
                            const status = result.data.status;
                            const progress = result.data.progress;
                            
                            console.log(`生成进度: ${progress}%`);
                            
                            if (status === 'completed' && result.data.result) {
                                UI_LOGGER.info('AI生成完成', { taskId });
                                const saveResult = await saveAIGenerated(result.data.result.image_url, prompt);
                                resolve(saveResult);
                                return;
                            }
                            
                            if (status === 'failed') {
                                UI_LOGGER.error('AI生成失败', { taskId });
                                reject(new Error('AI生成失败'));
                                return;
                            }
                            
                            attempts++;
                            if (attempts < maxAttempts) {
                                UI_LOGGER.debug(`继续轮询，进度: ${progress}%`);
                                setTimeout(checkStatus, interval);
                            } else {
                                UI_LOGGER.error('生成超时', { taskId, attempts });
                                reject(new Error('生成超时'));
                            }
                        }
                    } catch (error) {
                        UI_LOGGER.error('轮询错误', error);
                        reject(error);
                    }
                };
                
                checkStatus();
            });
        }

        async function saveAIGenerated(imageUrl, prompt) {
            UI_LOGGER.info('saveAIGenerated 被调用', { imageUrl, prompt: prompt?.slice(0, 30) });
            try {
                const result = await assetService.saveAIResult({
                        title: `AI生成 - ${prompt.slice(0, 20)}`,
                        image_url: imageUrl,
                        tags: 'ai,generated',
                        description: prompt
                    });
                UI_LOGGER.debug('API响应', { code: result.code, assetId: result.data?.id });
                
                if (result.code === 200) {
                    UI_LOGGER.info('AI生成结果已保存', { assetId: result.data.id });
                    await fetchAssets();
                    return result.data;
                }
            } catch (error) {
                UI_LOGGER.error('保存AI生成结果失败', error);
            }
            return null;
        }

        // 删除当前查看的资产
        async function deleteCurrentAsset() {
            UI_LOGGER.info('deleteCurrentAsset 被调用');
            const panel = document.getElementById('detailPanel');
            const id = parseInt(panel.dataset.assetId);
            const assetType = panel.dataset.assetType || 'normal';
            
            UI_LOGGER.debug('删除参数', { id, assetType });
            
            if (!id) {
                UI_LOGGER.warn('未找到资产ID');
                return;
            }
            
            if (!confirm('确定要删除这个资产吗？')) {
                UI_LOGGER.debug('用户取消删除');
                return;
            }
            
            try {
                UI_LOGGER.info('开始删除资产');
                showLoading(true);
                
                let result;
                
                if (assetType === 'canvas') {
                    UI_LOGGER.debug('删除画布资产');
                    result = await assetService.deleteCanvas(id);
                } else {
                    UI_LOGGER.debug('删除普通资产');
                    result = await assetService.deleteAsset(id);
                }
                
                UI_LOGGER.debug('删除API响应', { code: result.code });
                
                if (result.code === 200) {
                    UI_LOGGER.info(`删除成功: ${id}`);
                    closeDetail();
                    
                    if (assetType === 'canvas') {
                        await fetchCanvasAssets();
                    } else {
                        await fetchAssets();
                    }
                    
                    alert('删除成功！');
                } else {
                    UI_LOGGER.error('删除失败', { message: result.message });
                    alert('删除失败: ' + (result.message || '未知错误'));
                }
            } catch (error) {
                UI_LOGGER.error('删除错误', error);
                alert('删除失败，请重试');
            } finally {
                showLoading(false);
                UI_LOGGER.debug('deleteCurrentAsset 完成');
            }
        }

        // 使用当前查看的资产
        async function useCurrentAsset() {
            UI_LOGGER.info('useCurrentAsset 被调用');
            const panel = document.getElementById('detailPanel');
            const id = parseInt(panel.dataset.assetId);
            if (id) {
                await useAsset(id);
            } else {
                UI_LOGGER.warn('未找到资产ID');
            }
        }

            const canvasId = document.getElementById('contextMenu').dataset.canvasId;
            UI_LOGGER.info('openCanvasPage 被调用', { canvasId });
            if (canvasId) {
                window.open(`canvas.html?id=${canvasId}`, '_blank');

        }

        // 从右键菜单删除画布
        async function deleteCanvasFromMenu() {
            const canvasId = document.getElementById('contextMenu').dataset.canvasId;
            UI_LOGGER.info('deleteCanvasFromMenu 被调用', { canvasId });
            
            if (!canvasId) {
                UI_LOGGER.warn('未找到画布ID');
                alert('未找到画布ID');
                hideContextMenu();
                return;
            }
            
            if (!confirm('确定要删除这个画布吗？')) {
                UI_LOGGER.debug('用户取消删除画布');
                hideContextMenu();
                return;
            }
            
            try {
                UI_LOGGER.info('开始删除画布', { canvasId });
                showLoading(true);
                
                const result = await assetService.deleteCanvas(canvasId);
                UI_LOGGER.debug('API响应', { code: result.code });
                
                if (result.code === 200) {
                    UI_LOGGER.info(`画布删除成功: ${canvasId}`);
                    const panel = document.getElementById('detailPanel');
                    if (panel.classList.contains('open') && panel.dataset.assetId === canvasId) {
                        closeDetail();
                        UI_LOGGER.debug('已关闭详情面板');
                    }
                    
                    await fetchCanvasAssets();
                    alert('画布删除成功！');
                } else {
                    UI_LOGGER.error('删除画布失败', { message: result.message });
                    alert('删除失败: ' + (result.message || '未知错误'));
                }

                UI_LOGGER.error('删除画布失败', error);
                alert('删除失败，请重试');
            } finally {
                showLoading(false);
                hideContextMenu();
                UI_LOGGER.debug('deleteCanvasFromMenu 完成');
            }
        }

        function hideContextMenu() {

            document.getElementById('contextMenu').style.display = 'none';

        // ------------------------------------------------------------
        // 3.7 事件绑定与初始化 (Event Listeners & Init)
        // ------------------------------------------------------------
        
        function addDocumentListeners() {
            UI_LOGGER.info('addDocumentListeners 开始绑定事件');
            // 关闭弹窗（点击遮罩层）
            document.getElementById('createModal').addEventListener('click', function(e) {
                if (e.target === this) {
                    UI_LOGGER.debug('点击遮罩层关闭创建弹窗');
                    closeModal();
                }
            });


            // 搜索输入
            const searchInput = document.querySelector('.search-box input');
            if (searchInput) {
                UI_LOGGER.debug('搜索输入事件已绑定');
                searchInput.addEventListener('input', debounce(function(e) {
                    const keyword = e.target.value;
                    UI_LOGGER.info('搜索输入', { keyword });
                    currentFilter.keyword = keyword;
                    currentFilter.page = 1;
                    fetchAssets();
                }, 500));
            }

            // Tab 切换
            document.querySelectorAll('.tabs .tab').forEach((tab, index) => {
                tab.addEventListener('click', function() {
                    UI_LOGGER.info(`Tab切换: ${this.textContent.trim()}`);

                    if (batchMode) {
                        UI_LOGGER.debug('切换视图时退出批量模式');
                        toggleBatchMode();
                    }

                    document.querySelectorAll('.tabs .tab').forEach(t => t.classList.remove('active'));
                    this.classList.add('active');
                    
                    const typeMap = {
                        '素材': 'material',
                        '角色': 'character',
                        '画布': 'canvas',
                        '视频': 'video',
                        '全部': 'all'
                    };
                    const typeName = this.textContent.trim();
                    currentFilter.type = typeMap[typeName] || 'all';
                    currentFilter.page = 1;
                    UI_LOGGER.debug('Tab切换后筛选条件', { type: currentFilter.type });
                    
                    if (currentFilter.type === 'canvas') {
                        fetchCanvasAssets();
                    } else {
                        fetchAssets();
                    }
                });
            });

            // 排序切换
            const sortSpan = document.querySelector('.controls span:first-child');
            if (sortSpan) {
                UI_LOGGER.debug('排序事件已绑定');
                sortSpan.addEventListener('click', function() {
                    currentFilter.sort = currentFilter.sort === 'time_desc' ? 'time_asc' : 'time_desc';
                    UI_LOGGER.info('排序切换', { sort: currentFilter.sort });
                    this.innerHTML = currentFilter.sort === 'time_desc' ? 
                        '<i class="fas fa-clock"></i> 按时间倒序' : 
                        '<i class="fas fa-clock"></i> 按时间正序';
                    fetchAssets();
                });
            }

            // 关闭画布创建对话框（点击遮罩层）
            document.getElementById('canvasCreateModal').addEventListener('click', function(e) {
                if (e.target === this) {
                    UI_LOGGER.debug('点击遮罩层关闭画布创建弹窗');
                    closeCanvasCreateDialog();
                }
            });

            // 点击其他地方隐藏右键菜单
            document.addEventListener('click', function(e) {
                const menu = document.getElementById('contextMenu');
                if (menu.style.display === 'block' && !menu.contains(e.target)) {
                    UI_LOGGER.debug('点击外部隐藏右键菜单');
                    hideContextMenu();
                }
            });
            
            // 滚动时隐藏右键菜单
            document.addEventListener('scroll', function() {
                if (document.getElementById('contextMenu').style.display === 'block') {
                    UI_LOGGER.debug('滚动时隐藏右键菜单');
                    hideContextMenu();
                }
            });
            
            UI_LOGGER.info('addDocumentListeners 完成');
        }

        console.log('addEventListener'); 

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', async function() {
            UI_LOGGER.info('=== DOMContentLoaded 页面初始化开始 ===');
            // 初始化 Mock 数据以确保首次渲染
            renderAssets([]);
            UI_LOGGER.debug('初始空状态渲染完成');

            iniCompoments();
            UI_LOGGER.debug('组件初始化完成');
            
            // 绑定事件
            addDocumentListeners();
            UI_LOGGER.debug('事件绑定完成');
            
            // 加载数据
            UI_LOGGER.info('开始加载数据');
            await fetchAssets();
            UI_LOGGER.info('资产数据加载完成');
            await fetchRecentActivities();
            UI_LOGGER.debug('历史活动加载完成');
            
            const tags = await fetchTags();
            UI_LOGGER.info(`标签数据加载完成: ${tags.length} 个标签`);

            console.log('系统初始化完成');
            let existingTags = tags.map(e => e.name);
            if (tagSelect){
                tagSelect.setItems(existingTags);
                UI_LOGGER.debug('详情标签更新');
            }
            if (searchTagSelect){
                searchTagSelect.setItems(existingTags);
                UI_LOGGER.debug('搜索标签更新');
            }
            if (window.createTagSelect){
                window.createTagSelect.setItems(existingTags);
                UI_LOGGER.debug('创建弹窗标签更新');
            }

            // ===== 新增：批量标签选择器预加载 =====
            window._cachedTags = existingTags;
            UI_LOGGER.debug('标签已缓存', { count: existingTags.length });
            
            UI_LOGGER.info('=== 页面初始化完成 ===');
        });

        // 首次立即渲染空状态
        renderAssets(assetsData);
        console.log('renderAssets'); 
        UI_LOGGER.info('初始空状态已渲染');

        // 将模块内部函数暴露到全局作用域
        window.showView = showView;
        window.openModal = openModal;
        window.closeModal = closeModal;
        window.closeDetail = closeDetail;
        window.toggleEdit = toggleEdit;
        window.saveDetail = saveDetail;
        window.deleteCurrentAsset = deleteCurrentAsset;
        window.useCurrentAsset = useCurrentAsset;
        window.toggleBatchMode = toggleBatchMode;
        window.openBatchTagDialog = openBatchTagDialog;
        window.closeBatchTagDialog = closeBatchTagDialog;
        window.applyBatchTags = applyBatchTags;
        window.openCanvasCreateDialog = openCanvasCreateDialog;
        window.closeCanvasCreateDialog = closeCanvasCreateDialog;
        window.createCanvas = createCanvas;
        window.openCanvasPage = openCanvasPage;
        window.deleteCanvasFromMenu = deleteCanvasFromMenu;
        
        UI_LOGGER.info('全局函数已暴露到 window 对象');
    </script>
