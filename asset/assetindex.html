<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>漫剧资产库管理系统</title>
    
    <!-- ==================== 1. 样式模块 (Styles) ==================== -->
    <style>
        /* --- 1.1 全局变量与基础重置 (Variables & Reset) --- */
        :root {
            --bg-color: #f5f6fa;
            --sidebar-width: 260px;
            --primary-text: #333;
            --secondary-text: #888;
            --border-color: #e5e7eb;
            --card-radius: 12px;
            --transition: all 0.3s ease;
        }

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
        }
        
        body { 
            display: flex; 
            height: 100vh; 
            background-color: var(--bg-color); 
            overflow: hidden; 
            color: var(--primary-text); 
        }

        /* 自定义滚动条 */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #ddd; border-radius: 10px; }

        /* --- 1.2 侧边栏模块 (Sidebar) --- */
        .sidebar {
            width: var(--sidebar-width);
            background: #fff;
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border-color);
            overflow-y: auto;
        }

        .logo { 
            font-weight: 700; 
            font-size: 18px; 
            margin-bottom: 30px; 
            display: flex; 
            align-items: center; 
            gap: 10px; 
        }

        .nav-item {
            padding: 12px 12px;
            margin-bottom: 4px;
            border-radius: 8px;
            cursor: pointer;
            color: var(--secondary-text);
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: var(--transition);
        }
        .nav-item:hover { background: #f3f4f6; color: #000; }
        .nav-item.active { background: #eef2ff; color: #4f46e5; font-weight: 500; }
        
        .section-title { 
            font-size: 12px; 
            color: #aaa; 
            margin-top: 20px; 
            margin-bottom: 10px; 
            padding-left: 12px; 
        }

        .history-item {
            padding: 10px 12px;
            display: flex;
            gap: 10px;
            align-items: center;
            font-size: 13px;
            border-radius: 8px;
            cursor: pointer;
        }
        .history-item:hover { background: #f3f4f6; }
        .history-thumb { 
            width: 32px; 
            height: 32px; 
            background: #ddd; 
            border-radius: 6px; 
            object-fit: cover;
        }

        /* --- 1.3 主内容区域模块 (Main Content) --- */
        .main-content {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
            background-color: var(--bg-color);
        }

        .header-title { 
            font-size: 24px; 
            font-weight: 600; 
            margin-bottom: 20px; 
        }

        /* 工具栏 */
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            background: #fff;
            padding: 10px 16px;
            border-radius: 50px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }
        
        .tabs { display: flex; gap: 20px; }
        .tab { 
            padding: 6px 12px; 
            border-radius: 20px; 
            cursor: pointer; 
            font-size: 14px; 
            color: var(--secondary-text); 
            display: flex; 
            align-items: center; 
            gap: 6px; 
        }
        .tab.active { background: #f3f4f6; color: #000; font-weight: 500; }
        
        .controls { 
            display: flex; 
            gap: 15px; 
            font-size: 13px; 
            color: var(--secondary-text); 
            align-items: center; 
        }
        .btn-add { 
            background: #111; 
            color: #fff; 
            padding: 6px 16px; 
            border-radius: 20px; 
            border: none; 
            cursor: pointer; 
            font-size: 13px; 
        }
        .search-box { 
            background: #f5f6fa; 
            padding: 6px 12px; 
            border-radius: 20px; 
            display: flex; 
            align-items: center; 
            gap: 5px; 
        }
        .search-box input { 
            border: none; 
            background: transparent; 
            outline: none; 
            font-size: 13px; 
            width: 120px; 
        }

        /* --- 1.4 资产卡片网格模块 (Asset Grid) --- */
        .asset-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }

        .asset-card {
            background: #fff;
            border-radius: var(--card-radius);
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
            cursor: pointer;
            transition: transform 0.2s;
        }
        .asset-card:hover { transform: translateY(-4px); box-shadow: 0 8px 15px rgba(0,0,0,0.05); }

        .card-image-wrapper {
            background: #eef2f6; 
            height: 250px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card-image-wrapper img { max-width: 100%; max-height: 100%; object-fit: contain; }
        
        .card-info { padding: 12px; }
        .card-title { font-size: 14px; font-weight: 500; margin-bottom: 4px; }
        .card-date { font-size: 12px; color: #aaa; }

        /* 新增卡片按钮样式 */
        .add-card {
            background: #e5e7eb;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: var(--secondary-text);
            height: 100%;
            min-height: 250px; 
            border: 2px dashed transparent;
            transition: all 0.2s;
        }
        .add-card:hover { border-color: #aaa; background: #dcdfe5; }
        .add-icon { 
            width: 40px; 
            height: 40px; 
            background: #000; 
            border-radius: 50%; 
            color: #fff; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 20px; 
            margin-bottom: 10px; 
        }

        /* --- 1.5 弹窗模块 (Modal) --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4);
            display: none; justify-content: center; align-items: center;
            z-index: 100;
        }
        .modal-overlay.show { display: flex; }

        .modal {
            background: #fff;
            width: 700px;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }
        .modal h2 { margin-bottom: 10px; font-size: 20px; }
        .modal p { color: #888; margin-bottom: 20px; font-size: 14px; }
        
        .modal-options { display: flex; gap: 20px; }
        .modal-option {
            flex: 1;
            background: #f7f8fa;
            padding: 40px 20px;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            border: 1px solid transparent;
            transition: 0.2s;
        }
        .modal-option:hover { border-color: #ddd; background: #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .modal-option .icon { margin-bottom: 10px; font-size: 24px; }
        .modal-option h3 { font-size: 16px; margin-bottom: 4px; }
        .modal-option span { font-size: 12px; color: #888; }

        .close-modal {
            float: right; 
            font-size: 24px; 
            cursor: pointer; 
            color: #aaa;
        }

        /* --- 1.6 详情侧边栏模块 (Detail Panel) --- */
        .detail-panel {
            position: fixed;
            right: 0; top: 0; width: 500px; height: 100%;
            background: #fff;
            box-shadow: -5px 0 15px rgba(0,0,0,0.05);
            padding: 30px;
            transform: translateX(100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 99;
            overflow-y: auto;
        }
        .detail-panel.open { transform: translateX(0); }
        
        .detail-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .detail-content img { width: 100%; background: #f3f4f6; border-radius: 12px; margin-bottom: 20px; }
        .detail-field { margin-bottom: 15px; }
        .detail-field label { font-size: 12px; color: #888; display: block; }
        .detail-field div { font-size: 14px; font-weight: 500; margin-top: 4px; }
        
        .detail-actions { 
            margin-top: 40px; 
            border-top: 1px solid #eee; 
            padding-top: 20px;
            display: flex; 
            justify-content: flex-end; 
            gap: 10px;
        }
        .btn { padding: 8px 20px; border-radius: 20px; border: none; cursor: pointer; font-size: 13px; }
        .btn-black { background: #000; color: #fff; }
        .btn-ghost { background: transparent; border: 1px solid #ddd; }

        /* --- 1.7 加载状态模块 (Loading States) --- */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* --- 1.8 资产库选择对话框模块 (Asset Dialog) --- */
        .asset-dialog-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1001;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .asset-dialog-overlay.visible {
            display: flex;
        }

        .asset-dialog {
            background: #fff;
            border-radius: 16px;
            width: 66.67vw;
            height: 66.67vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .asset-dialog-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            border-bottom: 1px solid #e5e7eb;
        }

        .asset-dialog-header h3 {
            margin: 0;
            font-size: 16px;
            color: #333;
        }

        .asset-dialog-close {
            width: 32px;
            height: 32px;
            border: none;
            background: #f3f4f6;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: #666;
            transition: all 0.2s;
        }

        .asset-dialog-close:hover {
            background: #e5e7eb;
            color: #333;
        }

        .asset-dialog-tabs {
            display: flex;
            gap: 0;
            padding: 0 24px;
            border-bottom: 1px solid #e5e7eb;
        }

        .asset-dialog-tab {
            padding: 10px 20px;
            cursor: pointer;
            font-size: 13px;
            color: #666;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
            background: none;
            border-top: none;
            border-left: none;
            border-right: none;
        }

        .asset-dialog-tab:hover {
            color: #6366f1;
        }

        .asset-dialog-tab.active {
            color: #6366f1;
            border-bottom-color: #6366f1;
        }

        .asset-dialog-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 16px;
            align-content: start;
        }

        .asset-card {
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.2s;
            background: #fff;
        }

        .asset-card:hover {
            border-color: #6366f1;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.15);
        }

        .asset-card.selected {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        .asset-card-image {
            width: 100%;
            height: 120px;
            background: #f9fafb;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .asset-card-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .asset-card-image .placeholder {
            color: #ccc;
            font-size: 32px;
        }

        .asset-card-info {
            padding: 8px 12px;
            border-top: 1px solid #f3f4f6;
        }

        .asset-card-title {
            font-size: 12px;
            color: #333;
            font-weight: 500;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .asset-card-id {
            font-size: 10px;
            color: #999;
            margin-top: 2px;
        }

        .asset-dialog-footer {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            padding: 16px 24px;
            border-top: 1px solid #e5e7eb;
        }

        .asset-dialog-footer button {
            padding: 8px 20px;
            border-radius: 20px;
            border: none;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }

        .asset-dialog-footer .btn-cancel {
            background: #f3f4f6;
            color: #333;
        }

        .asset-dialog-footer .btn-cancel:hover {
            background: #e5e7eb;
        }

        .asset-dialog-footer .btn-apply {
            background: #6366f1;
            color: #fff;
        }

        .asset-dialog-footer .btn-apply:hover {
            background: #4f46e5;
        }

        .asset-dialog-footer .btn-apply:disabled {
            background: #c7d2fe;
            cursor: not-allowed;
        }

        /* 空状态 */
        .asset-empty {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px;
            color: #999;
            font-size: 14px;
        }

        /* 详情面板内的输入框样式 */
        .detail-field input[type="text"],
        .detail-field select,
        .detail-field textarea {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            font-size: 14px;
            margin-top: 4px;
            background: #f9fafb;
            transition: all 0.3s;
            font-family: inherit;
        }

        .detail-field input[type="text"]:disabled,
        .detail-field select:disabled,
        .detail-field textarea:disabled {
            background: transparent;
            border-color: transparent;
            color: var(--primary-text);
            padding-left: 0;
            cursor: default;
            opacity: 1;
        }

        .detail-field input[type="text"]:not(:disabled),
        .detail-field select:not(:disabled),
        .detail-field textarea:not(:disabled) {
            background: #fff;
            border-color: #d1d5db;
        }

        .detail-field input[type="text"]:not(:disabled):focus,
        .detail-field select:not(:disabled):focus,
        .detail-field textarea:not(:disabled):focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .detail-field textarea {
            resize: vertical;
            min-height: 80px;
        }

        /* 右键菜单样式 */
        #contextMenu div {
            transition: background 0.15s;
        }

        #contextMenu div:hover {
            background: #f3f4f6;
        }

        .tag-select-wrapper { position: relative; width: 100%; max-width: 500px; font-family: Arial, sans-serif; }
        .tag-input-box { border: 1px solid #d9d9d9; border-radius: 4px; padding: 4px 8px; display: flex; flex-wrap: wrap; align-items: center; background: #fff; min-height: 36px; box-sizing: border-box; cursor: text; transition: all 0.3s; }
        .tag-input-box:hover { border-color: #409EFF; }
        .tag-input-box:focus-within { border-color: #409EFF; box-shadow: 0 0 0 2px rgba(64, 158, 255, 0.2); }
        .tag-item { display: flex; align-items: center; background-color: #f4f4f5; border: 1px solid #e9e9eb; color: #606266; font-size: 12px; padding: 0 10px; height: 24px; border-radius: 4px; margin: 2px 4px 2px 0; box-sizing: border-box; white-space: nowrap; }
        .tag-item .close-btn { margin-left: 6px; cursor: pointer; color: #909399; font-weight: bold; }
        .tag-item .close-btn:hover { color: #f56c6c; }
        .tag-input { border: none; outline: none; height: 24px; line-height: 24px; font-size: 14px; flex-grow: 1; min-width: 60px; padding: 0; }
        .dropdown-list { position: absolute; top: 100%; left: 0; right: 0; max-height: 200px; overflow-y: auto; border: 1px solid #e4e7ed; border-radius: 4px; background: #fff; box-shadow: 0 2px 12px 0 rgba(0,0,0,0.1); margin-top: 4px; display: none; z-index: 100; }
        .dropdown-list.show { display: block; }
        .dropdown-item { padding: 8px 12px; cursor: pointer; color: #606266; font-size: 14px; }
        .dropdown-item:hover { background-color: #f5f7fa; }
        .dropdown-item.create-item { color: #409EFF; }
        .dropdown-item.disabled { color: #909399; cursor: default; }
        /* 禁用状态下的标签样式优化 */
        .tag-select-wrapper.disabled .tag-item {
            background-color: #f0f0f0;
            border-color: #d9d9d9;
            color: #909399;
            cursor: not-allowed;
        }

        /* 禁用状态下输入框隐藏后的容器样式 */
        .tag-select-wrapper.disabled .tag-input-box {
            padding: 4px 8px;
            min-height: 36px;
        }

        /* 批量选择模式样式 */
.asset-card.batch-mode {
    cursor: pointer;
    position: relative;
}

.asset-card.batch-mode .batch-checkbox {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 2px solid #ddd;
    background: white;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2;
    transition: all 0.2s;
    cursor: pointer;
}

.asset-card.batch-mode .batch-checkbox.checked {
    background: #6366f1;
    border-color: #6366f1;
    color: white;
}

.asset-card.batch-mode .batch-checkbox.checked::after {
    content: '✓';
    font-size: 14px;
    color: white;
}

.asset-card.batch-mode.selected {
    border: 2px solid #6366f1;
    box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
}
    </style>
    
    <!-- Font Awesome 图标库 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <!-- ==================== 2. 结构模块 (Structure) ==================== -->
    
    <!-- 2.1 侧边栏导航 -->
    <div class="sidebar">
        <div class="logo">
            <span style="background:#000; color:#fff; padding:2px 8px; border-radius:4px;">Q</span> 小云雀
        </div>

        <div class="nav-item">
            <i class="fas fa-plus-circle"></i> 创作
        </div>
        <div class="nav-item">
            <i class="fas fa-robot"></i> 短剧 Agent
        </div>
        <div class="nav-item active" onclick="showView('assets')">
            <i class="fas fa-folder-open"></i> 资产
        </div>

        <div class="section-title">创作历史</div>
        <div class="history-item">
            <img src="https://placehold.co/32x32/333/fff?text=H" class="history-thumb">
            <div>
                <div style="font-weight:500; font-size:12px;">古典舞角色展示</div>
                <div style="font-size:11px; color:#999;">全能创作Agent</div>
            </div>
        </div>
        <div class="history-item">
            <img src="https://placehold.co/32x32/333/fff?text=U" class="history-thumb">
            <div>
                <div style="font-weight:500; font-size:12px;">使用上传的角色...</div>
                <div style="font-size:11px; color:#999;">短剧 Agent</div>
            </div>
        </div>
    </div>

    <!-- 2.2 主内容区域 -->
    <div class="main-content" id="main-content">
        <h1 class="header-title">资产库</h1>

        <div class="toolbar">
            <div class="tabs">
                <div class="tab active"><i class="fas fa-all"></i> 全部</div>
                <div class="tab"><i class="fas fa-image"></i> 素材</div>
                <div class="tab"><i class="fas fa-video"></i> 视频</div>
                <div class="tab"><i class="fas fa-user"></i> 角色</div>
                <div class="tab"><i class="fas fa-paint-brush"></i> 画布</div>
            </div>
            <div class="controls">
                <button class="btn-add" onclick="openModal()">+ 新增</button>
                <!-- ===== 新增：批量操作按钮 ===== -->
                <button class="btn-add" onclick="toggleBatchMode()" style="background: #6366f1;">
                    <i class="fas fa-check-double"></i> 批量
                </button>
                <button class="btn-add" id="batchTagBtn" onclick="openBatchTagDialog()" style="background: #10b981; display: none;">
                    <i class="fas fa-tags"></i> 设置标签
                </button>
                <!-- ===== 新增结束 ===== -->
                <div id="searchTag"></div>
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" placeholder="搜索素材...">
                </div>
                <span><i class="fas fa-clock"></i> 按时间倒序</span>
                <span><i class="fas fa-th-large"></i></span>
            </div>
        </div>

        <!-- 资产卡片网格容器 -->
        <div class="asset-grid" id="asset-grid"></div>
    </div>

    <!-- 2.3 创建角色弹窗 -->
    <div class="modal-overlay" id="createModal">
        <div class="modal">
            <span class="close-modal" onclick="closeModal()">×</span>
            <h2>创建角色</h2>
            <p>选择一种方式创建你的角色资产。</p>
            <div class="modal-options">
                <div class="modal-option">
                    <div class="icon"><i class="fas fa-upload" style="font-size: 24px;"></i></div>

    <!-- ==================== 3. 脚本逻辑模块 (Scripts) ==================== -->
    <script type="module">

         // 从上级目录导入
        import { AssetService } from '../asset.service.js';
        import {TagSelect} from './TagSelect.js'

        // 自动从根目录加载 config.json
        // 注意：在子目录中，/config.json 依然指向根目录
        const assetService = new AssetService(fsUtils);

        // 初始化
        await assetService.init();
        
        
        // ------------------------------------------------------------
        // 3.1 全局状态管理 (State Management)
        // ------------------------------------------------------------
        let assetsData = [];          // 普通资产数据
        let canvasAssetsData = [];    // 画布资产数据
        
        // 筛选与分页状态
        let currentFilter = {
            type: 'all',
            keyword: '',
            sort: 'time_desc',
            page: 1,
            pageSize: 20
        };

        // API 基础路径
        const API_BASE = 'https://chenshengwei1.github.io/';
        let isEditing = false; // 是否处于编辑状态

        let tagSelect = null;
        let searchTagSelect = null;
        let currentSearchedTags = [];

        // ==================== 批量操作模块 ====================
        let batchMode = false;
        let selectedAssets = new Set(); // 存储选中的资产ID

        /**
        * 切换批量选择模式
        */
        function toggleBatchMode() {
            batchMode = !batchMode;
            selectedAssets.clear();
            
            const batchBtn = document.querySelector('.controls .btn-add:nth-child(2)');
            const tagBtn = document.getElementById('batchTagBtn');
            
            if (batchMode) {
                batchBtn.textContent = '退出批量';
                batchBtn.style.background = '#ef4444';
                tagBtn.style.display = 'inline-block';
                // 添加批量模式类到所有卡片
                document.querySelectorAll('.asset-card:not(.add-card)').forEach(card => {
                    card.classList.add('batch-mode');
                    addCheckboxToCard(card);
                });

                // ===== 新增：关闭可能打开的详情面板 =====
                closeDetail();
                // ===== 新增结束 =====
            } else {
                batchBtn.textContent = '批量';
                batchBtn.style.background = '#6366f1';
                tagBtn.style.display = 'none';
                // 移除批量模式类
                document.querySelectorAll('.asset-card.batch-mode').forEach(card => {
                    card.classList.remove('batch-mode');
                    const checkbox = card.querySelector('.batch-checkbox');
                    if (checkbox) checkbox.remove();
                });

                 // ===== 新增：移除选中样式 =====
                document.querySelectorAll('.asset-card.selected').forEach(card => {
                    card.classList.remove('selected');
                });
                // ===== 新增结束 =====

                updateSelectedCount();
            }
        }

        /**
        * 为卡片添加复选框
        */
        function addCheckboxToCard(card) {
            // 检查是否已经有复选框
            if (card.querySelector('.batch-checkbox')) return;
            
            const checkbox = document.createElement('div');
            checkbox.className = 'batch-checkbox';
            checkbox.dataset.id = card.dataset.assetId;
            
            // 点击复选框切换选中状态
            checkbox.addEventListener('click', function(e) {
                e.stopPropagation();
                toggleAssetSelection(this.dataset.id);
            });
            
            // 点击卡片切换选中状态
            card.addEventListener('click', function(e) {
                // 如果点击的是复选框本身，已经在上面的监听中处理了
                if (e.target.closest('.batch-checkbox')) return;
                const id = this.dataset.assetId;
                if (id) toggleAssetSelection(id);
            });
            
            card.appendChild(checkbox);

            // ===== 新增：如果该卡片已被选中，恢复选中状态 =====
            if (selectedAssets.has(card.dataset.assetId)) {
                checkbox.classList.add('checked');
                card.classList.add('selected');
            }
            // ===== 新增结束 =====
        }

        /**
        * 切换资产选中状态
        */
        function toggleAssetSelection(assetId) {
            if (!assetId) return;
            
            if (selectedAssets.has(assetId)) {
                selectedAssets.delete(assetId);
            } else {
                selectedAssets.add(assetId);
            }
            
            // 更新复选框UI
            const card = document.querySelector(`.asset-card[data-asset-id="${assetId}"]`);
            if (card) {
                const checkbox = card.querySelector('.batch-checkbox');
                if (checkbox) {
                    if (selectedAssets.has(assetId)) {
                        checkbox.classList.add('checked');
                        card.classList.add('selected');
                    } else {
                        checkbox.classList.remove('checked');
                        card.classList.remove('selected');
                    }
                }
            }
            
            updateSelectedCount();
        }

        /**
        * 更新选中数量显示
        */
        function updateSelectedCount() {
            const count = selectedAssets.size;
            const countDisplay = document.getElementById('selectedCount');
            if (countDisplay) {
                countDisplay.textContent = count;
            }
            
            // 更新按钮文本
            const tagBtn = document.getElementById('batchTagBtn');
            if (tagBtn) {
                tagBtn.innerHTML = `<i class="fas fa-tags"></i> 设置标签 (${count})`;
            }
        }

        /**
        * 打开批量设置标签对话框
        */
        function openBatchTagDialog() {
            if (selectedAssets.size === 0) {
                alert('请先选择要操作的资产');
                return;
            }
            
            document.getElementById('batchTagModal').classList.add('show');
            updateSelectedCount();
            
            // 初始化或重置标签选择组件
            if (!window.batchTagSelect) {
                window.batchTagSelect = new TagSelect('#batchTagInput', {
                    placeholder: '请选择或输入标签'
                });
                // 获取所有可用标签
                fetchAllTags().then(tags => {
                    window.batchTagSelect.setItems(tags);
                });
            } else {
                window.batchTagSelect.setSelected([]);
            }
        }

        /**
        * 关闭批量标签对话框
        */
        function closeBatchTagDialog() {
            document.getElementById('batchTagModal').classList.remove('show');
        }

        /**
        * 应用批量标签
        */
        async function applyBatchTags() {
            if (!window.batchTagSelect) return;
            
            const tags = window.batchTagSelect.getSelected();
            if (tags.length === 0) {
                alert('请选择至少一个标签');
                return;
            }
            
            const assetIds = Array.from(selectedAssets);
            if (assetIds.length === 0) {
                alert('没有选中的资产');
                return;
            }
            
            try {
                showLoading(true);
                
                const response = await fetch('/api/assets/batch-tags', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        asset_ids: assetIds,
                        tags: tags
                    })
                });
                
                const result = await response.json();
                
                if (result.code === 200) {
                    alert(`成功为 ${assetIds.length} 个资产设置标签`);
                    closeBatchTagDialog();
                    
                    // 刷新当前视图
                    if (currentFilter.type === 'canvas') {
                        await fetchCanvasAssets();
                    } else {
                        await fetchAssets();
                    }
                    
                    // 退出批量模式
                    toggleBatchMode();
                } else {
                    alert('批量设置失败: ' + (result.message || '未知错误'));
                }
            } catch (error) {
                console.error('批量设置标签失败:', error);
                alert('批量设置失败，请重试');
            } finally {
                showLoading(false);
            }
        }

        /**
        * 获取所有可用标签
        */
        async function fetchAllTags() {
            try {
                const response = await fetch(`${API_BASE}/assets/tags`);
                const result = await response.json();
                if (result.code === 200) {
                    return result.data.map(tag => tag.name || tag);
                }
            } catch (error) {
                console.error('获取标签失败:', error);
            }
            return [];
        }


        // ------------------------------------------------------------
        // 3.2 工具函数 (Utility Functions)
        // ------------------------------------------------------------
        
        /**
         * 防抖函数，用于优化搜索输入等高频操作
         */
        function debounce(func, wait) {
            let timeout;
            return function executedFunction(...args) {
                const later = () => {
                    clearTimeout(timeout);
                    func(...args);
                };
                clearTimeout(timeout);
                timeout = setTimeout(later, wait);
            };
        }

        /**
         * 显示或隐藏全局加载状态
         */
        function showLoading(show) {
            const loader = document.getElementById('loadingIndicator') || (() => {
                const div = document.createElement('div');
                div.id = 'loadingIndicator';
                div.style.cssText = 'position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.7); color: white; padding: 20px; border-radius: 8px; z-index: 1000;';
                div.innerHTML = '加载中...';
                document.body.appendChild(div);
                return div;
            })();
            
            loader.style.display = show ? 'block' : 'none';
        }

        // ------------------------------------------------------------
        // 3.3 视图切换与弹窗控制 (View & Modal Control)
        // ------------------------------------------------------------
        
        function showView(viewName) {
            console.log('Switching to', viewName);
        }

        function openModal() {
            document.getElementById('createModal').classList.add('show');

            // ===== 新增：重置标签选择 =====
            if (window.createTagSelect) {
                window.createTagSelect.setSelected([]);
            }
            // ===== 新增结束 =====
            
            const modalOptions = document.querySelector('.modal-options');
            modalOptions.innerHTML = `
                <div class="modal-option" onclick="document.getElementById('fileInput').click()">
                    <div class="icon"><i class="fas fa-upload" style="font-size: 24px;"></i></div>
                    <h3>上传角色图片</h3>
                    <span>添加宠物、二次元形象...</span>
                    <input type="file" id="fileInput" accept="image/*" multiple style="display:none">
                </div>
                <div class="modal-option" onclick="openAIGeneration()">
                    <div class="icon"><i class="fas fa-magic" style="font-size: 24px;"></i></div>
                    <h3>AI 生成角色</h3>
                    <span>输入描述，参考指定风格生成</span>
                </div>
            `;
            
            document.getElementById('fileInput')?.addEventListener('change', function(e) {
                const files = e.target.files;
                let result = true;

                // ===== 新增：获取选中的标签 =====
                const selectedTags = window.createTagSelect ? window.createTagSelect.getSelected() : [];
                const tagsString = selectedTags.join(',');
                // ===== 新增结束 =====

                for (const file of files) {
                    let fileName = file.name;
                    const title = fileName.substring(0, fileName.lastIndexOf('.')) || fileName;
                    if (title !== null) {
                        //result = uploadAsset(file, { title }) && result;

                        // ===== 修改：传入标签参数 =====
                        result = uploadAsset(file, { 
                            title: title, 
                            tags: tagsString  // 新增标签
                        }) && result;
                        // ===== 修改结束 =====
                    }
                }
                closeModal();
                if (result) {
                    alert('上传成功！');
                }
            });
        }

        function closeModal() {
            document.getElementById('createModal').classList.remove('show');

            // ===== 新增：关闭时重置标签 =====
            if (window.createTagSelect) {
                window.createTagSelect.setSelected([]);
            }
            // ===== 新增结束 =====
        }

        // 打开新建画布对话框
        function openCanvasCreateDialog() {
            document.getElementById('canvasCreateModal').classList.add('show');
            // 清空输入框
            document.getElementById('canvasName').value = '';
            document.getElementById('canvasDescription').value = '';
            document.getElementById('canvasVisibility').value = '所有人';
        }

        // 关闭新建画布对话框
        function closeCanvasCreateDialog() {
            document.getElementById('canvasCreateModal').classList.remove('show');
        }

        // 创建画布
        async function createCanvas() {
            const name = document.getElementById('canvasName').value.trim();
            const description = document.getElementById('canvasDescription').value.trim();
            const visibility = document.getElementById('canvasVisibility').value;
            
            if (!name) {
                alert('请输入画布名称');
                return;
            }
            
            try {
                showLoading(true);
                
                const response = await fetch('/api/assets/save-canvas', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        title: name,
                        description: description,
                        visibility: visibility,
                        type: 'canvas'
                    })
                });
                
                const result = await response.json();
                
                if (result.code === 200) {
                    closeCanvasCreateDialog();
                    await fetchCanvasAssets(); // 刷新画布列表
                    alert('画布创建成功！');
                } else {
                    alert('创建失败: ' + (result.message || '未知错误'));
                }
            } catch (error) {
                console.error('创建画布失败:', error);
                alert('创建失败，请重试');
            } finally {
                showLoading(false);
            }
        }

        function openAIGeneration() {
            const prompt = prompt('请输入角色描述:', '一位穿着古装的美少女');
            if (prompt) {
                const style = prompt('请输入风格 (default/anime/realistic):', 'default');
                showLoading(true);
                generateCharacter(prompt, style)
                    .then(result => {
                        showLoading(false);
                        if (result) {
                            closeModal();
                            alert('AI生成完成并已保存到资产库！');
                        }
                    })
                    .catch(error => {
                        showLoading(false);
                        alert('生成失败: ' + error.message);
                    });
            }
        }

        function closeDetail() {
            document.getElementById('detailPanel').classList.remove('open');
        }

        // ------------------------------------------------------------
        // 3.4 资产渲染模块 (Asset Rendering)
        // ------------------------------------------------------------
        
        /**
         * 渲染普通资产卡片列表
         */
        function renderAssets(data) {
            if (Array.isArray(data)) {
                console.log('Rendering assets:', data);
            } else {
                console.warn('Expected an array of assets, but got:', data);
            }
            const gridContainer = document.getElementById('asset-grid');
            gridContainer.innerHTML = '';
            
            // 新增卡片按钮
            const addCard = document.createElement('div');
            addCard.className = 'asset-card add-card';
            addCard.onclick = openModal;
            addCard.innerHTML = `
                <div class="add-icon">+</div>
                <div style="font-weight:500; font-size:14px;">新增角色</div>
                <div style="font-size:12px;">真人出镜或上传 / AI 生成</div>
            `;
            gridContainer.appendChild(addCard);

            if (!data || data.length === 0) {
                const emptyCard = document.createElement('div');
                emptyCard.style.cssText = 'grid-column: 1/-1; text-align: center; padding: 40px; color: #888;';
                emptyCard.innerHTML = '暂无资产，点击"新增"添加';
                gridContainer.appendChild(emptyCard);
                return;
            }

            let allTags = new Set();
            data.forEach(item => {
                const card = document.createElement('div');
                card.className = 'asset-card';
                card.dataset.assetId = item.id;
                 // ===== 修改：添加批量模式判断 =====
                card.onclick = function(e) {
                    if (batchMode) {
                        // 批量模式下，切换选中状态
                        toggleAssetSelection(this.dataset.assetId);
                        return;
                    }
                    // 非批量模式下，打开详情
                    openDetail(item.id);
                };
                // ===== 修改结束 =====
                
                const imageUrl = item.cover_url || '/assets/default-cover.png';
                
                card.innerHTML = `
                    <div class="card-image-wrapper">
                        <img src="${imageUrl}" alt="${item.title}" onerror="">
                    </div>
                    <div class="card-info">
                        <div class="card-title">${item.title || '未命名'}</div>
                        <div class="card-date">${item.created_at || ''}</div>
                    </div>
                `;
                gridContainer.appendChild(card);

                if (item.tags && item.tags.length){
                    item.tags.forEach(e =>allTags.add(e))
                    
                }
            });
            tagSelect.setItems(Array.from(allTags));
        }

        /**
         * 渲染画布资产卡片列表
         */
        function renderCanvasAssets(data) {
            if (Array.isArray(data)) {
                console.log('Rendering canvas assets:', data);
            } else {
                console.warn('Expected an array of canvas assets, but got:', data);
            }
            const gridContainer = document.getElementById('asset-grid');
            gridContainer.innerHTML = '';

        async function fetchAssets(params = {}) {
            try {
                const queryParams = { ...currentFilter, ...params };
                queryParams.pageSize = 200;
                const queryString = Object.entries(queryParams)
                    .filter(([key, value]) => value !== undefined && value !== '')
                    .map(([key, value]) => `${key}=${encodeURIComponent(value)}`)
                    .join('&');

                const newResult = await assetService.getAssets(queryParams);
                
                const url = `${API_BASE}/assets?${queryString}`;
                const response = await fetch(url);
                const result = await response.json();
                
                if (newResult.code === 200) {
                    assetsData = newResult.data.list;
                    currentFilter = { ...currentFilter, ...params };
                    renderAssets(assetsData);
                    return assetsData;
                } else {
                    console.error('获取资产失败:', newResult.message);
                    return [];
                }
            } catch (error) {
                console.error('API请求错误:', error);
                return [];
            }
        }

        async function pollGenerationStatus(taskId, interval = 2000, maxAttempts = 30) {
            let attempts = 0;
            
            return new Promise((resolve, reject) => {
                const checkStatus = async () => {
                    try {
                        const response = await fetch(`${API_BASE}/generate/task/${taskId}`);
                        const result = await response.json();
                        
                        if (result.code === 200) {
                            const status = result.data.status;
                            const progress = result.data.progress;
                            
                            console.log(`生成进度: ${progress}%`);
                            
                            if (status === 'completed' && result.data.result) {
                                const saveResult = await saveAIGenerated(result.data.result.image_url, prompt);
                                resolve(saveResult);
                                return;
                            }
                            
                            if (status === 'failed') {
                                reject(new Error('AI生成失败'));
                                return;
                            }
                            
                            attempts++;
                            if (attempts < maxAttempts) {
                                setTimeout(checkStatus, interval);
                            } else {
                                reject(new Error('生成超时'));
                            }
                        }
                    } catch (error) {
                        reject(error);
                    }
                };
                
                checkStatus();
            });
        }

                    await fetchAssets();
                    return result.data;
                }
            } catch (error) {
                console.error('保存AI生成结果失败:', error);
            }
            return null;
        }

        function addDocumentListeners() {
            // 关闭弹窗（点击遮罩层）
            document.getElementById('createModal').addEventListener('click', function(e) {
                if (e.target === this) closeModal();
            });


            // 搜索输入
            document.querySelector('.search-box input')?.addEventListener('input', debounce(function(e) {
                const keyword = e.target.value;
                currentFilter.keyword = keyword;
                currentFilter.page = 1;
                fetchAssets();
            }, 500));

            // Tab 切换
            document.querySelectorAll('.tabs .tab').forEach(tab => {
                tab.addEventListener('click', function() {

                     // ===== 新增：切换视图时退出批量模式 =====
                    if (batchMode) {
                        toggleBatchMode();
                    }
                    // ===== 新增结束 =====

                    document.querySelectorAll('.tabs .tab').forEach(t => t.classList.remove('active'));
                    this.classList.add('active');
                    
                    const typeMap = {
                        '素材': 'material',
                        '角色': 'character',
                        '画布': 'canvas',
                        '视频': 'video',
                        '全部': 'all'
                    };
                    const typeName = this.textContent.trim();
                    currentFilter.type = typeMap[typeName] || 'all';
                    currentFilter.page = 1;
                    
                    if (currentFilter.type === 'canvas') {
                        fetchCanvasAssets();
                    } else {
                        fetchAssets();
                    }
                });
            });

            // 排序切换
            document.querySelector('.controls span:first-child')?.addEventListener('click', function() {
                currentFilter.sort = currentFilter.sort === 'time_desc' ? 'time_asc' : 'time_desc';
                this.innerHTML = currentFilter.sort === 'time_desc' ? 
                    '<i class="fas fa-clock"></i> 按时间倒序' : 
                    '<i class="fas fa-clock"></i> 按时间正序';
                fetchAssets();
            });

            // 关闭画布创建对话框（点击遮罩层）
            document.getElementById('canvasCreateModal').addEventListener('click', function(e) {
                if (e.target === this) closeCanvasCreateDialog();
            });

             // 点击其他地方隐藏右键菜单
            document.addEventListener('click', function(e) {
                const menu = document.getElementById('contextMenu');
                if (menu.style.display === 'block' && !menu.contains(e.target)) {
                    hideContextMenu();
                }
            });
            
            // 滚动时隐藏右键菜单
            document.addEventListener('scroll', function() {
                hideContextMenu();
            });

            // 加载数据
            await fetchAssets();
            await fetchRecentActivities();
            
            const tags = await fetchTags();
            console.log('可用标签:', tags);
            console.log('系统初始化完成');
            let existingTags = tags.map(e => e.name);
            if (tagSelect){
                tagSelect.setItems(existingTags);
            }
            if (searchTagSelect){
                searchTagSelect.setItems(existingTags);
            }
            if (window.createTagSelect){
                window.createTagSelect.setItems(existingTags);
            }

             // ===== 新增：批量标签选择器预加载 =====
            // 等用户打开对话框时再初始化
            // 但可以先获取标签数据缓存起来
            window._cachedTags = existingTags;
            // ===== 新增结束 =====
        });

        // 首次立即渲染空状态
        renderAssets(assetsData);
    </script>
</body>
</html>
