<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Java 面试题 · 多类型 · 本地题库 + 大模型</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; padding: 24px 16px 80px; line-height: 1.6; }
  .container { max-width: 960px; margin: 0 auto; }

  .header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
  .header h1 { font-size: 22px; font-weight: 700; background: linear-gradient(135deg, #60a5fa, #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .header-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .badge { font-size: 12px; padding: 4px 10px; border-radius: 20px; background: #1e293b; border: 1px solid #334155; color: #94a3b8; }

  button { cursor: pointer; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; padding: 10px 18px; transition: all .2s; font-family: inherit; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .btn-primary { background: #3b82f6; color: #fff; }
  .btn-primary:hover:not(:disabled) { background: #2563eb; }
  .btn-ghost { background: #1e293b; color: #cbd5e1; border: 1px solid #334155; }
  .btn-ghost:hover:not(:disabled) { background: #334155; }
  .btn-ok { background: #16a34a; color: #fff; }
  .btn-ok:hover:not(:disabled) { background: #15803d; }
  .btn-sm { padding: 6px 12px; font-size: 13px; }

  /* 题型面板 */
  .type-panel { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 14px 18px; margin-bottom: 16px; }
  .type-panel-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
  .type-panel-title { font-weight: 600; color: #cbd5e1; font-size: 14px; }
  .type-panel-actions { display: flex; gap: 6px; }
  .type-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; border-radius: 20px; background: #0f172a; border: 1px solid #334155; color: #94a3b8; font-size: 13px; cursor: pointer; transition: all .15s; user-select: none; font-weight: 500; }
  .chip:hover { border-color: #475569; color: #cbd5e1; }
  .chip.active { background: #1e3a5f; border-color: #3b82f6; color: #93c5fd; }
  .chip input { display: none; }

  /* 配置面板 */
  .config-panel { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 18px 20px; margin-bottom: 16px; }
  .config-panel summary { cursor: pointer; font-weight: 600; color: #cbd5e1; outline: none; user-select: none; }
  .config-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-top: 16px; }
  .config-grid label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #94a3b8; }
  .config-grid input, .config-grid select { background: #0f172a; border: 1px solid #334155; border-radius: 6px; padding: 8px 10px; color: #e2e8f0; font-size: 13px; font-family: inherit; outline: none; width: 100%; }
  .config-grid input:focus, .config-grid select:focus { border-color: #3b82f6; }
  .model-row { display: flex; gap: 6px; }
  .model-row input { flex: 1; min-width: 0; }
  .model-row button { flex-shrink: 0; white-space: nowrap; padding: 8px 12px; }
  #cfgModelSelect { margin-top: 6px; }
  .preset-row { display: flex; flex-direction: column; gap: 6px; grid-column: 1 / -1; }
  .preset-select { background: #0f172a; border: 1px solid #334155; border-radius: 6px; padding: 8px 10px; color: #cbd5e1; font-size: 13px; font-family: inherit; outline: none; width: 100%; }
  .checkbox-row { flex-direction: row !important; align-items: center; gap: 8px; grid-column: 1 / -1; cursor: pointer; color: #cbd5e1; }
  .checkbox-row input { width: 16px; height: 16px; accent-color: #3b82f6; }
  .config-actions { margin-top: 14px; display: flex; gap: 10px; flex-wrap: wrap; }
  .config-tip { margin-top: 10px; font-size: 12px; color: #64748b; }
  .config-tip code { background: #0f172a; padding: 1px 5px; border-radius: 4px; color: #94a3b8; }

  /* 题目 */
  .question-list { display: flex; flex-direction: column; gap: 16px; }
  .question-card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px 22px; transition: border-color .3s; }
  .question-card.answered { border-color: #3b82f6; }
  .question-card.correct { border-color: #22c55e; }
  .question-card.wrong { border-color: #ef4444; }

  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-index { font-size: 12px; color: #64748b; font-weight: 600; }
  .q-tag { font-size: 11px; padding: 2px 8px; border-radius: 10px; background: #0f172a; color: #60a5fa; border: 1px solid #1e40af; }

  .q-text { font-size: 15px; font-weight: 500; margin-bottom: 14px; color: #f1f5f9; }

  .option { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border-radius: 8px; border: 1px solid #334155; margin-bottom: 8px; cursor: pointer; transition: background .15s, border-color .15s; }
  .option:hover { background: #273449; border-color: #475569; }
  .option.selected { border-color: #3b82f6; background: #1e3a5f; }
  .option.correct-answer { border-color: #22c55e; background: #052e16; }
  .option.wrong-answer { border-color: #ef4444; background: #450a0a; }
  .option input[type="radio"] { margin-top: 3px; accent-color: #3b82f6; cursor: pointer; flex-shrink: 0; }
  .option-label { font-weight: 600; color: #94a3b8; min-width: 20px; }
  .option-text { flex: 1; font-size: 14px; }

  .explanation { margin-top: 14px; padding: 14px 16px; border-radius: 8px; background: #0f172a; border-left: 3px solid #3b82f6; font-size: 13px; color: #cbd5e1; display: none; }
  .explanation.show { display: block; }
  .explanation .exp-title { font-weight: 700; color: #60a5fa; margin-bottom: 4px; font-size: 12px; text-transform: uppercase; letter-spacing: .5px; }

  .status-bar { margin-top: 20px; text-align: center; font-size: 13px; color: #64748b; min-height: 20px; }

  .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid #334155; border-top-color: #3b82f6; border-radius: 50%; animation: spin .7s linear infinite; vertical-align: middle; margin-right: 8px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .fab-refresh { position: fixed; bottom: 24px; right: 24px; z-index: 100; width: 52px; height: 52px; border-radius: 50%; background: #3b82f6; color: #fff; font-size: 22px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 20px rgba(59,130,246,.5); transition: transform .2s, background .2s; border: none; cursor: pointer; }
  .fab-refresh:hover:not(:disabled) { transform: scale(1.08); background: #2563eb; }
  .fab-refresh:disabled { opacity: .5; }

  @media (min-width: 700px) { .fab-refresh { display: none; } }
  @media (max-width: 500px) {
    body { padding: 16px 10px 80px; }
    .question-card { padding: 16px; }
  }
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <h1>☕ 技术面试题 · 多类型</h1>
    <div class="header-actions">
      <span class="badge" id="qCountBadge">0 道</span>
      <span class="badge" id="historyBadge">历史 0 条</span>
      <button class="btn-ok btn-sm" onclick="exportHistory('md')">📥 导出 MD</button>
      <button class="btn-ok btn-sm" onclick="exportHistory('json')">📥 导出 JSON</button>
      <button class="btn-primary btn-sm" id="btnRefreshTop" onclick="refresh()">⟳ 刷新题目</button>
    </div>
  </div>

  <!-- 题型选择 -->
  <div class="type-panel">
    <div class="type-panel-header">
      <span class="type-panel-title">📚 题目类型（可多选）</span>
      <div class="type-panel-actions">
        <button class="btn-ghost btn-sm" onclick="selectAllTypes(true)">全选</button>
        <button class="btn-ghost btn-sm" onclick="selectAllTypes(false)">清空</button>
        <button class="btn-ghost btn-sm" onclick="resetTypes()">默认 Java</button>
      </div>
    </div>
    <div class="type-chips" id="typeChips"></div>
  </div>

  <!-- 大模型设置 -->
  <details class="config-panel" id="configPanel">
    <summary>⚙️ 大模型设置（可选，不配置也能用本地题库）</summary>
    <div class="config-grid">
      <div class="preset-row">
        <span style="font-size:13px;color:#94a3b8;">快速选择服务商（填充下方 Base URL）</span>
        <select class="preset-select" id="cfgPreset">
          <option value="">— 选择预置服务商 —</option>
        </select>
      </div>
      <label>Base URL
        <input id="cfgBaseUrl" placeholder="https://api.openai.com/v1" />
      </label>
      <label>API Key
        <input id="cfgApiKey" type="password" placeholder="sk-..." />
      </label>
      <label>模型名（可下拉选择，也可手动输入）
        <div class="model-row">
          <input id="cfgModel" placeholder="点击「获取模型」或直接输入" autocomplete="off" />
          <button type="button" class="btn-ghost btn-sm" onclick="fetchModels(false)" id="btnFetchModels">获取模型</button>
        </div>
        <select id="cfgModelSelect" style="display:none;"></select>
      </label>
      <label>Temperature
        <input id="cfgTemp" type="number" step="0.1" min="0" max="2" value="0.8" />
      </label>
      <label>max_tokens
        <input id="cfgMaxTokens" type="number" min="512" max="8000" value="4096" />
      </label>
      <label class="checkbox-row">
        <input type="checkbox" id="cfgUseLLM" />
        <span>启用大模型生成题目（失败时自动回退本地题库）</span>
      </label>
    </div>
    <div class="config-actions">
      <button class="btn-ghost btn-sm" onclick="saveConfig()">💾 保存配置</button>
      <button class="btn-ghost btn-sm" onclick="testConnection()">🔌 测试连接</button>
    </div>
    <div class="config-tip">纯浏览器直连，接口需支持 CORS。Base URL 填到 <code>/v1</code> 层级。模型列表通过 <code>GET {BaseURL}/models</code> 自动获取。</div>
  </details>

  <div class="question-list" id="questionList"></div>
  <div class="status-bar" id="statusBar"></div>
</div>

<button class="fab-refresh" id="btnRefreshFab" onclick="refresh()" title="刷新题目">⟳</button>

<script>
/* =========================================================
   题型与题库（10 类，120+ 题）
   ========================================================= */
const TYPE_LABELS = {
  java: 'Java',
  python: 'Python',
  javascript: 'JavaScript',
  typescript: 'TypeScript',
  springboot: 'Spring Boot',
  springcloud: 'Spring Cloud',
  mysql: 'MySQL',
  redis: 'Redis',
  docker: 'Docker / K8s',
  algorithm: '算法与数据结构'
};

const BANK = {
  java: [
    { question: "JDK 8 中 HashMap 的底层数据结构是？", options: ["数组 + 链表", "数组 + 链表 + 红黑树", "纯链表", "平衡二叉树"], answer: 1, explanation: "JDK 8 起 HashMap 采用数组 + 链表 + 红黑树。当桶的链表长度达到 8 且数组长度不小于 64 时转红黑树。" },
    { question: "ArrayList 第一次添加元素时的默认容量是多少？", options: ["0", "10", "16", "8"], answer: 1, explanation: "默认容量为 10，第一次 add 时才真正分配。" },
    { question: "JDK 8 中 ConcurrentHashMap 如何保证线程安全？", options: ["分段锁 Segment", "全局 synchronized", "CAS + synchronized 锁单个桶", "读写锁"], answer: 2, explanation: "JDK 8 抛弃分段锁，改用 CAS + synchronized 只锁当前桶的头节点。" },
    { question: "下列哪个不是 Object 类的方法？", options: ["equals", "hashCode", "toString", "length"], answer: 3, explanation: "length 不是 Object 的方法。" },
    { question: "volatile 关键字能保证什么？", options: ["原子性", "可见性并禁止指令重排序", "只保证原子性", "没有任何作用"], answer: 1, explanation: "volatile 保证可见性和有序性，不保证 i++ 这类复合操作的原子性。" },
    { question: "JDK 6 之后 synchronized 的锁升级顺序是？", options: ["重量级 → 轻量级 → 偏向锁", "偏向锁 → 轻量级锁 → 重量级锁", "轻量级 → 偏向锁 → 重量级", "无锁 → 重量级"], answer: 1, explanation: "无锁 → 偏向锁 → 轻量级锁 → 重量级锁，只能升级不能降级。" },
    { question: "ThreadLocal 可能造成内存泄漏的根本原因是？", options: ["key 是强引用", "Entry 的 key 是弱引用而 value 是强引用", "value 是弱引用", "没有 remove 方法"], answer: 1, explanation: "key 被回收后 value 仍被线程持有，长时间存活且不 remove 会泄漏。" },
    { question: "下列哪个不属于 JVM 运行时数据区？", options: ["程序计数器", "虚拟机栈", "CPU 寄存器组", "方法区"], answer: 2, explanation: "CPU 寄存器组属于硬件，不属于 JVM 运行时数据区。" },
    { question: "类加载中为静态变量分配内存并设置零值的阶段是？", options: ["加载", "验证", "准备", "初始化"], answer: 2, explanation: "准备阶段分配内存设零值，初始化阶段赋真正初始值。" },
    { question: "双亲委派模型的主要作用是？", options: ["加快类加载", "避免核心类被篡改", "减少内存", "支持热部署"], answer: 1, explanation: "让类加载先交给父加载器，防止自定义 java.lang.String 覆盖 JDK 实现。" },
    { question: "下列哪个是 Stream 的终端操作？", options: ["filter", "map", "collect", "sorted"], answer: 2, explanation: "collect 是终端操作，触发流计算；其他三个是中间操作。" },
    { question: "Integer a=127,b=127; a==b 的结果是？", options: ["true", "false", "编译错误", "运行时异常"], answer: 0, explanation: "IntegerCache 缓存 -128~127，都指向同一对象。" },
    { question: "String s='a'+'b'; 编译后会发生什么？", options: ["运行时才拼接", "编译期优化为 'ab'", "编译错误", "创建两个对象"], answer: 1, explanation: "两个字面量相加属于编译期常量折叠。" },
    { question: "接口中的 default 方法是在哪个版本引入的？", options: ["Java 7", "Java 8", "Java 9", "Java 11"], answer: 1, explanation: "Java 8 引入 default 和 static 方法以扩展接口。" },
    { question: "关于抽象类和接口，下列说法错误的是？", options: ["抽象类可以有构造方法", "接口方法默认 public abstract", "一个类只能继承一个抽象类", "接口可以定义实例变量"], answer: 3, explanation: "接口字段默认 public static final 常量，不能有实例变量。" },
    { question: "try-with-resources 中的资源必须实现哪个接口？", options: ["Serializable", "Cloneable", "AutoCloseable", "Runnable"], answer: 2, explanation: "需实现 AutoCloseable（或其子接口 Closeable）。" },
    { question: "泛型擦除后 List<String> 和 List<Integer> 的 getClass() 结果？", options: ["不同", "相同", "编译错误", "运行时异常"], answer: 1, explanation: "泛型编译后被擦除，运行时都是 List。" },
    { question: "下列哪个是受检异常？", options: ["NullPointerException", "IOException", "ArithmeticException", "ClassCastException"], answer: 1, explanation: "IOException 继承 Exception 且非 RuntimeException，属于受检异常。" },
    { question: "线程池核心线程满、队列满、最大线程未满时怎么处理新任务？", options: ["直接拒绝", "创建新线程执行", "阻塞等待", "丢弃任务"], answer: 1, explanation: "执行顺序：核心 → 队列 → 非核心 → 拒绝策略。" },
    { question: "下列哪个不是 JDK 线程池自带的拒绝策略？", options: ["AbortPolicy", "CallerRunsPolicy", "DiscardPolicy", "WaitPolicy"], answer: 3, explanation: "JDK 提供 Abort/CallerRuns/Discard/DiscardOldest，没有 WaitPolicy。" },
    { question: "死锁的四个必要条件不包括？", options: ["互斥", "占有且等待", "可剥夺", "循环等待"], answer: 2, explanation: "第三个是“不可剥夺”，可剥夺正好相反。" },
    { question: "CAS 的 ABA 问题可以用什么方式解决？", options: ["加锁", "版本号，如 AtomicStampedReference", "volatile", "synchronized"], answer: 1, explanation: "AtomicStampedReference 附加版本号，识别 ABA 变化。" },
    { question: "AQS 内部的核心数据结构是？", options: ["红黑树", "双向链表（CLH 队列变体）", "数组", "哈希表"], answer: 1, explanation: "AQS 用 FIFO 双向链表等待队列管理阻塞线程。" },
    { question: "关于 CountDownLatch 和 CyclicBarrier，说法正确的是？", options: ["没有区别", "CountDownLatch 不可重用，CyclicBarrier 可重用", "CyclicBarrier 不可重用", "两者都可重用"], answer: 1, explanation: "CountDownLatch 计数到 0 后不能重置；CyclicBarrier 可循环使用。" },
    { question: "ReentrantLock 相比 synchronized 的优势是？", options: ["使用更简单", "支持公平锁、可中断、可超时", "性能一定更高", "无需手动释放"], answer: 1, explanation: "提供公平锁、lockInterruptibly、tryLock 超时等能力，需手动 unlock。" },
    { question: "Java 线程的 RUNNABLE 状态实际对应？", options: ["包含操作系统层面的运行中和就绪", "只代表运行中", "已终止", "阻塞"], answer: 0, explanation: "Java 的 RUNNABLE 合并了就绪和运行两种状态。" },
    { question: "-Xmx 参数的作用是？", options: ["初始堆大小", "最大堆大小", "线程栈大小", "元空间大小"], answer: 1, explanation: "-Xmx 设置最大堆；-Xms 初始堆；-Xss 线程栈。" },
    { question: "G1 垃圾收集器的特点是？", options: ["单线程", "分代收集且支持可预测停顿模型", "只回收新生代", "已废弃"], answer: 1, explanation: "G1 分 Region，可通过 -XX:MaxGCPauseMillis 设置目标停顿。" },
    { question: "软引用（SoftReference）的回收时机是？", options: ["永不回收", "内存不足时回收", "下次 GC 必回收", "只能手动"], answer: 1, explanation: "软引用在内存不足时被回收，弱引用下次 GC 必回收。" },
    { question: "下列哪个不是 Java 线程的状态？", options: ["NEW", "BLOCKED", "SUSPENDED", "WAITING"], answer: 2, explanation: "Thread.State 有 6 种，没有 SUSPENDED。" },
    { question: "HashMap 中 key 为 null 时会怎样？", options: ["抛 NPE", "放在索引 0 的桶中", "不允许 null", "随机放置"], answer: 1, explanation: "JDK 8 中 null 的 hash 为 0，最终落在 table[0] 对应的桶。" },
    { question: "String 被设计为不可变类的主要原因不包括？", options: ["线程安全", "可缓存 hash", "节省内存", "便于被其他类继承扩展"], answer: 3, explanation: "String 是 final 类，不允许被继承。" },
    { question: "StringBuilder 和 StringBuffer 的主要区别是？", options: ["没有区别", "StringBuffer 线程安全，StringBuilder 非线程安全", "StringBuilder 线程安全", "两者都线程安全"], answer: 1, explanation: "StringBuffer 方法加 synchronized；StringBuilder 不加锁。" },
    { question: "transient 关键字的作用是？", options: ["序列化时忽略该字段", "禁止访问", "加锁", "变静态"], answer: 0, explanation: "transient 字段不参与默认序列化，反序列化后为默认值。" },
    { question: "关于静态方法，说法正确的是？", options: ["可以被重写", "不能重写，只能被隐藏", "视情况而定", "编译报错"], answer: 1, explanation: "静态方法属于类，子类同名静态方法叫隐藏，不支持多态。" },
    { question: "创建子类对象时构造方法的执行顺序是？", options: ["父类构造 → 子类构造", "子类构造 → 父类构造", "随机", "静态块先于父类构造"], answer: 0, explanation: "先父后子；静态代码块在类加载时执行，早于所有构造方法。" },
    { question: "关于重载和重写，说法正确的是？", options: ["重载发生在子类", "重写要求方法签名相同", "重载要求返回值不同", "重写可任意改返回类型"], answer: 1, explanation: "重写要求方法名和参数列表相同，返回值可协变。" },

   ========================================================= */
function loadHistory() {
  try {
    const raw = localStorage.getItem(HISTORY_KEY);
    history = raw ? JSON.parse(raw) : [];
    if (!Array.isArray(history)) history = [];
  } catch (e) { history = []; }
  historyMap = new Map();
  for (const rec of history) if (rec && rec.question) historyMap.set(rec.question, rec);
  updateHistoryBadge();
}
function saveHistory() {
  if (history.length > HISTORY_MAX) history = history.slice(-HISTORY_MAX);
  historyMap = new Map();
  for (const rec of history) if (rec && rec.question) historyMap.set(rec.question, rec);
  try { localStorage.setItem(HISTORY_KEY, JSON.stringify(history)); }
  catch (e) {
    history = history.slice(-Math.floor(HISTORY_MAX / 2));
    historyMap = new Map();
    for (const rec of history) if (rec && rec.question) historyMap.set(rec.question, rec);
    try { localStorage.setItem(HISTORY_KEY, JSON.stringify(history)); } catch (e2) {}
  }
  updateHistoryBadge();
}
function addQuestionsToHistory(questions, source) {
  const ts = new Date().toISOString();
  for (const q of questions) {
    if (historyMap.has(q.question)) continue;
    const rec = {
      question: q.question,
      type: q.type || 'java',
      options: q.options.slice(),
      answer: q.answer,
      explanation: q.explanation,
      userAnswer: null,
      timestamp: ts,
      source: source || 'unknown'
    };
    history.push(rec);
    historyMap.set(rec.question, rec);
  }
  saveHistory();
}
function updateUserAnswer(question, userAnswer) {
  const rec = historyMap.get(question);
  if (!rec) return;
  rec.userAnswer = userAnswer;
  rec.answeredAt = new Date().toISOString();
  saveHistory();
}
function updateHistoryBadge() {
  const el = document.getElementById('historyBadge');
  if (el) {
    const answered = history.filter(h => h.userAnswer !== null && h.userAnswer !== undefined).length;
    el.textContent = `历史 ${history.length} 条 / 已答 ${answered}`;
  }
}

/* =========================================================
   导出
   ========================================================= */
function exportHistory(format) {
  if (!history.length) { alert('暂无历史题目可导出'); return; }
  const ts = new Date();
  const stamp = ts.toISOString().replace(/[:.]/g, '-').slice(0, 19);
  const answered = history.filter(h => h.userAnswer !== null && h.userAnswer !== undefined);
  const correct = answered.filter(h => h.userAnswer === h.answer);

  if (format === 'json') {
    const data = {
      exportedAt: ts.toISOString(),
      total: history.length, answered: answered.length, correct: correct.length,
      accuracy: answered.length ? +(correct.length / answered.length * 100).toFixed(2) : 0,
      questions: history.map(h => ({
        question: h.question,
        type: h.type || 'java',
        typeLabel: TYPE_LABELS[h.type] || h.type,
        options: h.options,
        answer: h.answer, correctOption: optionLetter(h.answer),
        explanation: h.explanation,
        userAnswer: (h.userAnswer === undefined || h.userAnswer === null) ? null : h.userAnswer,
        userOption: (h.userAnswer === undefined || h.userAnswer === null) ? null : optionLetter(h.userAnswer),
        isCorrect: (h.userAnswer === undefined || h.userAnswer === null) ? null : (h.userAnswer === h.answer),
        timestamp: h.timestamp, source: h.source
      }))
    };
    downloadFile(JSON.stringify(data, null, 2), `quiz-history-${stamp}.json`, 'application/json');
  } else {
    const lines = [];
    lines.push('# 技术面试题历史记录', '');
    lines.push(`- 导出时间：${formatDate(ts)}`);
    lines.push(`- 题目总数：${history.length}`);
    lines.push(`- 已作答：${answered.length}`);
    lines.push(`- 答对：${correct.length}`);
    lines.push(`- 正确率：${answered.length ? (correct.length / answered.length * 100).toFixed(1) + '%' : '—'}`, '', '---', '');

    history.forEach((h, i) => {
      const typeLabel = TYPE_LABELS[h.type] || h.type || 'Java';
      lines.push(`## ${i + 1}. [${typeLabel}] ${h.question}`, '');
      h.options.forEach((opt, oi) => {
        const isAns = oi === h.answer;
        const isUser = oi === h.userAnswer;
        const mark = isUser ? '- [x]' : '- [ ]';
        let suffix = '';
        if (isAns) suffix += ' ✅ 正确答案';
        if (isUser && !isAns) suffix += ' ❌ 你的选择';
        if (isUser && isAns) suffix += ' （你答对了）';
        lines.push(`${mark} ${optionLetter(oi)}. ${opt}${suffix}`);
      });
      lines.push('');
      if (h.userAnswer === null || h.userAnswer === undefined) {
        lines.push('**你的选择**：未作答');
      } else {
        const ok = h.userAnswer === h.answer;
        lines.push(`**你的选择**：${optionLetter(h.userAnswer)} ${ok ? '✅ 正确' : '❌ 错误'}（正确答案：${optionLetter(h.answer)}）`);
      }
      lines.push('', `**解析**：${h.explanation || '—'}`, '');
      lines.push(`<sub>类型：${typeLabel} ｜ 来源：${h.source === 'llm' ? '大模型生成' : '本地题库'} ｜ 出现：${formatDate(new Date(h.timestamp))}${h.answeredAt ? ' ｜ 作答：' + formatDate(new Date(h.answeredAt)) : ''}</sub>`, '', '---', '');
    });
    downloadFile(lines.join('\n'), `quiz-history-${stamp}.md`, 'text/markdown');
  }
  setStatus(`✅ 已导出 ${history.length} 道历史题目（${format.toUpperCase()}）`, 'success');
}
function optionLetter(idx) { return String.fromCharCode(65 + idx); }
function formatDate(d) {
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}
function downloadFile(content, filename, mime) {
  const blob = new Blob([content], { type: mime + ';charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

/* =========================================================
   模型拉取
   ========================================================= */
function modelsEndpoint(baseUrl) {
  let b = baseUrl.trim().replace(/\/+$/, '');
  if (!b) throw new Error('请先填写 Base URL');
  if (/\/chat\/completions$/.test(b)) return b.replace(/\/chat\/completions$/, '/models');
  return b + '/models';
}
function isGeminiNative(baseUrl) {
  return /generativelanguage\.googleapis\.com/.test(baseUrl) && !/\/openai/.test(baseUrl);
}
function geminiBase(baseUrl) {
  return baseUrl.trim().replace(/\/+$/, '').replace(/\/(v1beta|v1)\/.*$/, '').replace(/\/(v1beta|v1)$/, '');
}

async function fetchModels(silent) {
  const baseUrl = document.getElementById('cfgBaseUrl').value.trim();
  const apiKey = document.getElementById('cfgApiKey').value.trim();
  const btn = document.getElementById('btnFetchModels');
  const sel = document.getElementById('cfgModelSelect');
  const modelInput = document.getElementById('cfgModel');

  if (!baseUrl) { if (!silent) setStatus('❌ 请先填写 Base URL', 'error'); return; }

  btn.disabled = true;
  const orig = btn.textContent;
  btn.textContent = '拉取中…';
  if (!silent) setStatus('<span class="spinner"></span> 正在拉取模型列表…');

  try {
    let ids;
    if (isGeminiNative(baseUrl)) {
      const res = await fetch(geminiBase(baseUrl) + '/v1beta/models', {
        headers: { 'x-goog-api-key': apiKey }
      });
      if (!res.ok) { let t=''; try{t=await res.text();}catch(e){} throw new Error('HTTP ' + res.status + ' ' + t.slice(0,200)); }
      const data = await res.json();
      ids = (data.models || []).map(m => (m.name || '').replace(/^models\//, '')).filter(Boolean);
    } else {
      const res = await fetch(modelsEndpoint(baseUrl), {
        headers: { 'Authorization': 'Bearer ' + apiKey }
      });
      if (!res.ok) { let t=''; try{t=await res.text();}catch(e){} throw new Error('HTTP ' + res.status + ' ' + t.slice(0,200)); }
      const data = await res.json();
      const list = Array.isArray(data) ? data : (data.data || data.models || []);
      ids = list.map(m => typeof m === 'string' ? m : (m.id || m.name || m.model)).filter(Boolean);
    }
    ids = [...new Set(ids)].sort();
    if (!ids.length) throw new Error('返回列表为空');

    sel.innerHTML = '';
    ids.forEach(id => {
      const o = document.createElement('option');
      o.value = id; o.textContent = id; sel.appendChild(o);
    });
    sel.style.display = 'block';

    const cur = modelInput.value.trim();
    if (cur && ids.includes(cur)) { sel.value = cur; }
    else {
      const prefer = ids.find(m => /chat|gpt|deepseek|qwen|glm|claude|llama|gemini|mixtral|abab|baichuan|yi/i.test(m)) || ids[0];
      sel.value = prefer; modelInput.value = prefer;
    }
    modelsFetchedFor = baseUrl + '|' + apiKey;
    setStatus(`✅ 共 ${ids.length} 个模型，当前：${modelInput.value}`, 'success');
  } catch (e) {
    if (silent) console.warn('[自动获取模型失败]', e.message);
    else setStatus('❌ 获取模型失败：' + e.message + '（仍可手动输入模型名）', 'error');
  } finally {
    btn.disabled = false; btn.textContent = orig;
  }
}
function maybeAutoFetchModels() {
  const baseUrl = document.getElementById('cfgBaseUrl').value.trim().replace(/\/+$/, '');
  const apiKey = document.getElementById('cfgApiKey').value.trim();
  if (!baseUrl || !apiKey) return;
  const key = baseUrl + '|' + apiKey;
  if (key === modelsFetchedFor) return;
  fetchModels(true);
}

/* =========================================================
   抽题：多类型均分
   ========================================================= */
function pickFromBank(types, targetCount) {
  if (!types.length) types = ['java'];
  const perType = Math.ceil(targetCount / types.length);
  const picked = [];
  const seenQ = new Set(currentQuestions.map(q => q.question));
  for (const t of types) {
    const pool = BANK[t] || [];
    if (!pool.length) continue;
    // 优先取本轮未出现过的
    let candidates = pool.filter(q => !seenQ.has(q.question));
    if (candidates.length < perType) candidates = pool.slice();
    shuffle(candidates);
    const take = candidates.slice(0, perType);
    take.forEach(q => picked.push({ ...q, type: t }));
  }
  return picked.slice(0, targetCount);
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
function escapeHtml(str) {
  const div = document.createElement('div');

function renderQuestions(questions) {
  const list = document.getElementById('questionList');
  document.getElementById('qCountBadge').textContent = questions.length + ' 道';
  if (!questions.length) {
    list.innerHTML = '<div style="text-align:center; padding:60px 20px; color:#475569;">暂无题目</div>';
    return;
  }
  list.innerHTML = questions.map((q, idx) => {
    const typeLabel = TYPE_LABELS[q.type] || q.type || 'Java';
    const optionHtml = q.options.map((opt, oi) => {
      const letter = optionLetter(oi);
      return `<label class="option" onclick="selectOption(${idx}, ${oi}, event)">
          <input type="radio" name="q_${idx}" value="${oi}" />
          <span class="option-label">${letter}.</span>
          <span class="option-text">${escapeHtml(opt)}</span>
        </label>`;
    }).join('');
    return `<div class="question-card" id="qcard_${idx}">
        <div class="q-meta">
          <span class="q-index">第 ${idx + 1} 题</span>
          <span class="q-tag">${escapeHtml(typeLabel)}</span>
        </div>
        <div class="q-text">${escapeHtml(q.question)}</div>
        <div class="options">${optionHtml}</div>
        <div class="explanation" id="exp_${idx}">
          <div class="exp-title">解析</div>
          <div class="exp-content">${escapeHtml(q.explanation)}</div>
        </div>
      </div>`;
  }).join('');
}

/* =========================================================
   作答
   ========================================================= */
function selectOption(qIdx, oIdx, event) {
  if (event) event.preventDefault();
  const q = currentQuestions[qIdx];
  if (!q) return;
  const card = document.getElementById('qcard_' + qIdx);
  if (card.classList.contains('answered')) return;

  card.classList.add('answered');
  card.classList.add(oIdx === q.answer ? 'correct' : 'wrong');

  card.querySelectorAll('.option').forEach((el, i) => {
    el.style.pointerEvents = 'none';
    const input = el.querySelector('input');
    if (input) input.disabled = true;
    if (i === q.answer) el.classList.add('correct-answer');
    if (i === oIdx && oIdx !== q.answer) el.classList.add('wrong-answer');
    if (i === oIdx) {
      el.classList.add('selected');
      if (input) input.checked = true;
    }
  });

  const exp = document.getElementById('exp_' + qIdx);
  if (exp) exp.classList.add('show');
  updateUserAnswer(q.question, oIdx);
}

function friendlyError(status, bodyText) {
  let msg = bodyText;
  try { const j = JSON.parse(bodyText); msg = (j.error && j.error.message) || j.message || bodyText; } catch (e) {}
  const map = {
    401: 'API Key 无效或已过期',
    402: '账户余额不足（Insufficient Balance），请充值或更换 Key',
    403: '无权限访问该模型',
    404: '接口路径或模型不存在，请检查 Base URL（是否填到 /v1）和模型名',
    429: '请求过于频繁或超出配额，请稍后再试',
    500: '服务端错误', 502: '网关错误', 503: '服务不可用'
  };
  return map[status] ? `${map[status]}（HTTP ${status}：${msg}）` : `HTTP ${status}：${msg}`;
}

/* =========================================================
   大模型生成
   ========================================================= */
function buildPrompt(types, previousQuestions) {
  const typeLabels = types.map(t => TYPE_LABELS[t] || t).join('、');
  let avoidBlock = '';
  if (previousQuestions.length > 0) {
    const recent = previousQuestions.slice(-60);
    avoidBlock = `\n\n【重要】以下题目已经出现过，请严格避免生成相同或高度相似的题目：\n` +
      recent.map((q, i) => `${i + 1}. ${q}`).join('\n');
  }
  return `请生成 20 道技术面试单选题，覆盖以下方向（尽量均匀分布）：${typeLabels}。

要求：
- 每道题必须有 4 个选项，且只有一个正确答案。
- 解析要简洁清晰地说明原因。
- 严格以 JSON 数组格式返回，不要输出任何 markdown 代码块标记或额外文字。
- 数组每个元素结构：
{
  "question": "题干",
  "options": ["A选项", "B选项", "C选项", "D选项"],
  "answer": 0,
  "explanation": "解析"
}
其中 answer 是正确答案在 options 数组中的索引（0~3）。
${avoidBlock}`;
}

async function fetchFromLLM(cfg, types) {
  const url = cfg.baseUrl + '/chat/completions';
  const headers = { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + cfg.apiKey };
  const body = JSON.stringify({
    model: cfg.model,
    messages: [
      { role: 'system', content: '你是严谨的技术面试题生成器，只输出合法 JSON 数组，不输出 markdown 代码块标记或其他文字。' },
      { role: 'user', content: buildPrompt(types, askedQuestions) }
    ],
    temperature: cfg.temperature,
    max_tokens: cfg.maxTokens
  });

  const resp = await fetch(url, { method: 'POST', headers, body });
  if (!resp.ok) {
    const t = await resp.text();
    throw new Error(friendlyError(resp.status, t));
  }
  const data = await resp.json();
  let raw = (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content) || '';
  raw = raw.trim().replace(/^```(?:json)?\s*/i, '').replace(/\s*```$/i, '').trim();

  let arr;
  try { arr = JSON.parse(raw); }
  catch (e) {
    const m = raw.match(/\[[\s\S]*\]/);
    if (!m) throw new Error('无法解析大模型返回的 JSON');
    arr = JSON.parse(m[0]);
  }
  if (!Array.isArray(arr) || !arr.length) throw new Error('大模型返回题目为空');

  const fallbackType = types[0] || 'java';
  const cleaned = [];
  for (const q of arr) {
    if (!q.question || !Array.isArray(q.options) || q.options.length < 4) continue;
    const ans = typeof q.answer === 'number' ? q.answer : parseInt(q.answer);
    if (isNaN(ans) || ans < 0 || ans > 3) continue;
    cleaned.push({
      question: String(q.question).trim(),
      options: q.options.slice(0, 4).map(o => String(o).trim()),
      answer: ans,
      explanation: String(q.explanation || '暂无解析').trim(),
      type: fallbackType  // 大模型题目统一归为第一个选中类型，便于统计
    });
  }
  if (!cleaned.length) throw new Error('没有有效题目');

  for (const q of cleaned) if (!askedQuestions.includes(q.question)) askedQuestions.push(q.question);
  saveAsked();
  return cleaned;
}

/* =========================================================
   刷新
   ========================================================= */
async function refresh() {
  if (isGenerating) return;
  if (!activeTypes.length) { activeTypes = ['java']; renderTypeChips(); }

  const cfg = loadConfig();
  const useLLM = document.getElementById('cfgUseLLM').checked;

  if (useLLM) {
    if (!cfg.baseUrl || !cfg.apiKey || !cfg.model) {
      document.getElementById('configPanel').open = true;
      setStatus('⚠️ 已勾选大模型但配置不完整，本次使用本地题库', 'error');
    } else {
      isGenerating = true; setLoading(true);
      setStatus('<span class="spinner"></span> 大模型正在生成题目…');
      try {
        const qs = await fetchFromLLM(cfg, activeTypes);
        currentQuestions = qs;
        renderQuestions(qs);
        addQuestionsToHistory(qs, 'llm');
        setStatus(`✅ 大模型生成 ${qs.length} 道题目（类型：${activeTypes.map(t => TYPE_LABELS[t]).join('、')}）`, 'success');
        window.scrollTo({ top: 0, behavior: 'smooth' });
        return;
      } catch (e) {
        setStatus('⚠️ 大模型生成失败：' + e.message + '，已回退到本地题库', 'error');
      } finally { isGenerating = false; setLoading(false); }
    }
  }

  const qs = pickFromBank(activeTypes, 20);
  currentQuestions = qs;
  renderQuestions(qs);
  addQuestionsToHistory(qs, 'local');
  if (!useLLM) setStatus(`✅ 已从本地题库加载 ${qs.length} 道题目（${activeTypes.map(t => TYPE_LABELS[t]).join('、')}）`, 'success');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* =========================================================
   已出题干
   ========================================================= */
function loadAsked() {
  try { const raw = localStorage.getItem(ASKED_KEY); askedQuestions = raw ? JSON.parse(raw) : []; if (!Array.isArray(askedQuestions)) askedQuestions = []; }
  catch (e) { askedQuestions = []; }
}
function saveAsked() {
  if (askedQuestions.length > 200) askedQuestions = askedQuestions.slice(-200);
  localStorage.setItem(ASKED_KEY, JSON.stringify(askedQuestions));
}

/* =========================================================
   测试连接
   ========================================================= */
async function testConnection() {
  const cfg = readConfigFromForm();
  if (!cfg.baseUrl || !cfg.apiKey || !cfg.model) {
    alert('请先填写 Base URL、API Key、模型名（可先点「获取模型」）'); return;
  }
  setStatus('<span class="spinner"></span> 正在测试连接…');
  try {
    const resp = await fetch(cfg.baseUrl + '/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + cfg.apiKey },
      body: JSON.stringify({
        model: cfg.model,
        messages: [{ role: 'user', content: '只回复 OK' }],
        max_tokens: 10, temperature: 0
      })
    });
    if (!resp.ok) { const t = await resp.text(); throw new Error(friendlyError(resp.status, t)); }
    const data = await resp.json();
    const reply = (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content) || '';
    setStatus('✅ 连接成功，模型回复：' + reply.slice(0, 40), 'success');
    if (!document.getElementById('cfgModelSelect').style.display ||
        document.getElementById('cfgModelSelect').style.display === 'none') fetchModels(true);
  } catch (e) {
    setStatus('❌ 连接失败：' + e.message, 'error');
  }
}

/* =========================================================
   初始化
   ========================================================= */
(function init() {
  // 预置服务商下拉
  const presetSel = document.getElementById('cfgPreset');
  BASE_URL_PRESETS.forEach(p => {
    const o = document.createElement('option');
    o.value = p.url; o.textContent = p.name + ' — ' + p.url;
    presetSel.appendChild(o);
  });
  presetSel.addEventListener('change', () => {
    if (presetSel.value) {
      document.getElementById('cfgBaseUrl').value = presetSel.value;
      document.getElementById('cfgModelSelect').style.display = 'none';
      document.getElementById('cfgModel').value = '';
      // 触发一次静默拉取
      maybeAutoFetchModels();
    }
  });

  // 模型选择下拉同步输入框
  document.getElementById('cfgModelSelect').addEventListener('change', e => {
    document.getElementById('cfgModel').value = e.target.value;
  });

  // Base URL / API Key 失焦自动拉取
  document.getElementById('cfgBaseUrl').addEventListener('blur', maybeAutoFetchModels);
  document.getElementById('cfgApiKey').addEventListener('blur', maybeAutoFetchModels);

  fillConfigToUI();
  loadActiveTypes();
  renderTypeChips();
  loadAsked();
  loadHistory();

  // 立即出题
  const qs = pickFromBank(activeTypes, 20);
  currentQuestions = qs;
  renderQuestions(qs);
  addQuestionsToHistory(qs, 'local');
  setStatus(`已从本地题库加载 ${qs.length} 道题目（${activeTypes.map(t => TYPE_LABELS[t]).join('、')}），点击「刷新题目」可更换`);

  // 若有保存配置，静默拉一次模型
  const cfg = loadConfig();
  if (cfg.baseUrl && cfg.apiKey) fetchModels(true);
})();
</script>
